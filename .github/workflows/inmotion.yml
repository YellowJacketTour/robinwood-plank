name: InMotion Passenger CI/CD

# Deployment runs from master, the repository's default branch. It ran from
# `inmotion` until 2026-08-02; development continues on `dev` (the renamed
# `inmotion`), and merging that into master is what ships. `inmotion` is kept
# in the PR list only so any branch still named that opens a checked PR.
on:
  pull_request:
    branches:
      - master
      - dev
      - inmotion
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, provision/verify the drand relayer, provision the Season 2 $PLANK KOTH watcher cron, audit the pre-season $PLANK record, set the admin allowlist, install the vault-deploy dispatch token, purge and rebuild the market snapshots, repair mislabelled chain-event ledger rows, or dump the KOTH review queue (TEMPORARY diagnostic, see scripts/plank-koth-review-queue-dump.ts's own header).
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - provision-relayer
          - verify-relayer
          - provision-plank-koth-watch
          - audit-preseason-record
          - set-admin-allowlist
          - set-dispatch-token
          - purge-market-data
          - repair-activity
          - diagnose-plank-koth-review-queue
          - reprocess-plank-koth-review-queue
          - reset-plank-koth-rpc-cursor
          - evaluate-plank-koth-tx
          - provision-plank-koth-gap-finder
          - configure-plankspace-x
      repair_from_block:
        description: >-
          repair-activity only — first block to re-derive. Defaults to
          27935949, the block NEXT_PUBLIC_MARKET_VAULT_ADDRESS drifted stale
          and V3 deposits/redeems started being stored as open-market sales
          (see commit dd750d1).
        required: false
        type: string
      repair_to_block:
        description: >-
          repair-activity only — last block to re-derive. Empty resolves to
          the current chain head at run time.
        required: false
        type: string
      plank_rpc_cursor_reset_block:
        description: >-
          reset-plank-koth-rpc-cursor only — real Robinhood Chain block
          number to rewind the RPC scanner's own cursor to (must be BEFORE
          its current position; this script refuses to move it forward).
        required: false
        type: string
      plank_eval_tx_hash:
        description: >-
          evaluate-plank-koth-tx only — real transaction hash to directly
          evaluate against production, bypassing discovery/cursor.
        required: false
        type: string
      confirmation:
        description: Relay-disable confirmation, when required.
        required: false
        type: string
      admin_addresses:
        description: >-
          set-admin-allowlist only — comma-separated 0x wallets allowed to sign
          /admin mutations. Empty uses the PLANK_ADMIN_ADDRESSES repo variable.
        required: false
        type: string

concurrency:
  group: inmotion-passenger-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plank
          POSTGRES_USER: plankapp
          POSTGRES_PASSWORD: github-actions-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plankapp -d plank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEPLOYMENT_VERSION: ${{ github.sha }}
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: plank
      PGUSER: plankapp
      PGPASSWORD: github-actions-postgres
      PGPOOL_MAX: 4
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://plank.tanggang.life' }}
      NEXT_PUBLIC_MARKET_ENABLED: ${{ vars.NEXT_PUBLIC_MARKET_ENABLED || 'true' }}
      # As of 2026-08-01 V3 ("Premium Plank Liquidity") is live and the repo
      # Variable NEXT_PUBLIC_MARKET_VAULT_ADDRESS points at it. V2/WormWood
      # (0xc4B29D7a…) has a critical LP drain
      # (audit held privately) and must never be
      # recommended for new deposits or LP. The LIVE value comes from the
      # repo Variable; the literal defaults below are only a CI safety
      # fallback for if the Variable is ever unset — intentionally left at
      # V1-only (never V2) rather than bumped to V3, so an unset Variable
      # fails safe instead of silently reintroducing the live vault address
      # into a build.
      NEXT_PUBLIC_MARKET_VAULT_ADDRESS: ${{ vars.NEXT_PUBLIC_MARKET_VAULT_ADDRESS || '0xb2019Fd4cA24502e812C0C73b751Fa49979BF708' }}
      NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESS: ${{ vars.NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESS || '' }}
      NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESSES: ${{ vars.NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESSES || '' }}
      NEXT_PUBLIC_MINT_START_AT: ${{ vars.NEXT_PUBLIC_MINT_START_AT }}
      NEXT_PUBLIC_ROBINHOOD_RPC_URL: ${{ vars.NEXT_PUBLIC_ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      NEXT_PUBLIC_RULES_RELAXED: ${{ vars.NEXT_PUBLIC_RULES_RELAXED || 'true' }}
      NEXT_PUBLIC_TRADE_OPENS_AT: ${{ vars.NEXT_PUBLIC_TRADE_OPENS_AT || '2026-07-25T21:20:00.000Z' }}
      NEXT_PUBLIC_TRADE_PAUSED: ${{ vars.NEXT_PUBLIC_TRADE_PAUSED || 'false' }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      # Feature flags baked into the client bundle at build time. These are
      # repository VARIABLES, not secrets — NEXT_PUBLIC_* values are readable
      # in the shipped JS by design, so storing them as secrets would be
      # false assurance. Default off; set the variable to 'true' to enable.
      NEXT_PUBLIC_GASLESS_ENABLED: ${{ vars.NEXT_PUBLIC_GASLESS_ENABLED || 'false' }}
      NEXT_PUBLIC_ZEROX_ENABLED: ${{ vars.NEXT_PUBLIC_ZEROX_ENABLED || 'false' }}
      NEXT_PUBLIC_ZEROX_CROSSCHAIN_ENABLED: ${{ vars.NEXT_PUBLIC_ZEROX_CROSSCHAIN_ENABLED || 'false' }}
      NEXT_PUBLIC_CROSSCHAIN_ENABLED: ${{ vars.NEXT_PUBLIC_CROSSCHAIN_ENABLED || 'false' }}
      # Referral attribution. Build-time like the flags above, so turning it
      # on or off is a rebuild + redeploy, not an env edit on the box. No
      # secret to stage: the feature needs only Postgres, which the server
      # already has. Attribution is PERMANENT once written (migration 010) --
      # enabling this starts writing rows that only an admin revoke can clear.
      NEXT_PUBLIC_REFERRAL_ENABLED: ${{ vars.NEXT_PUBLIC_REFERRAL_ENABLED || 'false' }}
      # 'reown' swaps the connect surface to AppKit; unset keeps the legacy
      # WalletConnect QR modal. Off in production until dogfooded.
      NEXT_PUBLIC_WALLET_UI: ${{ vars.NEXT_PUBLIC_WALLET_UI || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint:inmotion
      - run: npx tsc --noEmit
      - run: npm run db:migrate
      # CCS-2L settlement gates. The wei-exact JS<->Solidity differential
      # (test/contracts/PlankCcs2LSettlement.test.ts) runs inside `npm test`
      # via test:contracts; this step adds the node-only simulation invariants
      # and the house-layer partition-invariance proof (exit 1 on any failure).
      - run: npm run test:ccs2l
      - run: npm test
      - run: npm run test:postgres
      - run: npm run build
      - run: npm run build:relayer
      - run: npm run build:market-refresh
      - run: npm run build:reindex
      - run: npm run build:plank-koth-watch
      - run: npm run build:audit-preseason
      - run: npm run build:koth-diag
      - run: npm run build:koth-reprocess
      - run: npm run build:koth-cursor-reset
      - run: npm run build:koth-eval-tx
      - run: npm run build:koth-gap-finder

      - name: Package standalone Passenger release
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .next/standalone/.next
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/deploy/inmotion
          cp -R deploy/inmotion/postgres .next/standalone/deploy/inmotion/postgres
          cp deploy/inmotion/passenger.cjs .next/standalone/deploy/inmotion/passenger.cjs
          mkdir -p .next/standalone/scripts
          cp scripts/migrate-postgres.mjs .next/standalone/scripts/migrate-postgres.mjs
          cp scripts/postgres-maintenance.mjs .next/standalone/scripts/postgres-maintenance.mjs
          cp scripts/backup-postgres.mjs .next/standalone/scripts/backup-postgres.mjs
          cp scripts/snapshot-vault-state.mjs .next/standalone/scripts/snapshot-vault-state.mjs
          # Bundled by build:market-refresh / build:reindex — the standalone
          # tree has no tsx, so both run the esbuild output, same as the
          # drand relayer.
          test -s .next/standalone/scripts/refresh-market-data.mjs
          test -s .next/standalone/scripts/reindex-chain-events.mjs
          test -s .next/standalone/scripts/plank-koth-watch-standalone.mjs
          test -s .next/standalone/scripts/audit-plank-historical-record.mjs
          test -s .next/standalone/scripts/plank-koth-review-queue-dump.mjs
          test -s .next/standalone/scripts/reprocess-plank-koth-review-queue.mjs
          test -s .next/standalone/scripts/reset-plank-koth-rpc-cursor.mjs
          test -s .next/standalone/scripts/evaluate-plank-koth-tx.mjs
          test -s .next/standalone/scripts/plank-koth-gap-finder-standalone.mjs
          test -s .next/standalone/ops/drand-relayer/relay-drand.mjs
          cp scripts/verify-relayer-log.mjs .next/standalone/ops/drand-relayer/verify-log.mjs
          # build:market-refresh's esbuild step marks @envio-dev/* as
          # --external (it's a native addon, not something esbuild can
          # bundle), so refresh-market-data.mjs resolves it from real
          # node_modules at runtime. Next's standalone output only traces
          # and ships what the Next.js APP graph itself imports — this
          # script isn't part of that graph, so the package silently never
          # made it into a single release, and refresh-market-data.mjs has
          # been crashing with ERR_MODULE_NOT_FOUND on every production
          # invocation since @envio-dev/hypersync-client was introduced
          # (confirmed live 2026-08-28 via the refresh-market-activity
          # dispatch operation — this is why plank.love's Activity feed and
          # 24h stats were stuck stale for weeks despite clean deploys).
          # Copying the whole scoped dir carries both the JS wrapper and
          # whichever platform-native optionalDependency npm actually
          # resolved on this runner (linux-x64-gnu, matching InMotion's
          # shared Linux hosting).
          mkdir -p .next/standalone/node_modules/@envio-dev
          cp -R node_modules/@envio-dev/. .next/standalone/node_modules/@envio-dev/
          test -d .next/standalone/node_modules/@envio-dev/hypersync-client
          test -d .next/standalone/node_modules/@envio-dev/hypersync-client-linux-x64-gnu
          tar -C .next/standalone -czf passenger-release.tgz .

      - name: Upload release artifact
        id: upload-release-artifact
        # GitHub can reject artifact creation when the repository quota is
        # exhausted even though every build gate passed. Keep the build
        # green and let the exact-SHA cache fallback carry this release.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: passenger-${{ github.sha }}
          path: passenger-release.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Save release cache fallback
        if: github.event_name != 'pull_request' && steps.upload-release-artifact.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: passenger-release.tgz
          # This is a release transport fallback, not a mutable build cache.
          # The commit SHA prevents a deploy from restoring another release.
          key: passenger-release-${{ github.sha }}

  deploy:
    needs: build
    if: >-
      vars.INMOTION_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    # The mandatory custom-format PostgreSQL backup now exceeds 30 minutes as
    # durable market and playtest history grows: every deploy on 2026-09-03
    # was killed by this job timeout during pg_dump ("The operation was
    # canceled") before activation, leaving production on a stale release.
    # Keep the safety gate, but give the backup a window that cannot be the
    # thing that blocks a release.
    timeout-minutes: 120
    environment: inmotion-staging
    env:
      INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
      INMOTION_PORT: ${{ secrets.INMOTION_PORT }}
      INMOTION_USER: ${{ secrets.INMOTION_USER }}
      INMOTION_SSH_KEY: ${{ secrets.INMOTION_SSH_KEY }}
      INMOTION_HOST_KEY: ${{ secrets.INMOTION_HOST_KEY }}
      INMOTION_APP_DIR: ${{ vars.INMOTION_APP_DIR }}
      INMOTION_NODE_BIN: ${{ vars.INMOTION_NODE_BIN }}
      INMOTION_HEALTH_URL: ${{ vars.INMOTION_HEALTH_URL || 'https://plank.tanggang.life' }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Download release artifact
        id: download-release-artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: passenger-${{ github.sha }}

      - name: Restore release cache fallback
        if: steps.download-release-artifact.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: passenger-release.tgz
          key: passenger-release-${{ github.sha }}

      - name: Assert release is present
        shell: bash
        run: test -s passenger-release.tgz

      - name: Configure trusted SSH host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INMOTION_HOST"
          test -n "$INMOTION_USER"
          test -n "$INMOTION_SSH_KEY"
          test -n "$INMOTION_HOST_KEY"
          test -n "$INMOTION_APP_DIR"
          test -n "$INMOTION_NODE_BIN"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$INMOTION_SSH_KEY" > "$HOME/.ssh/inmotion"
          printf '%s\n' "$INMOTION_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/inmotion" "$HOME/.ssh/known_hosts"

      - name: Upload immutable release
        env:
          UNISWAP_API_KEY: ${{ secrets.UNISWAP_API_KEY }}
          RPC_URL: ${{ secrets.RPC_URL }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          OPENSEA_API_KEYS: ${{ secrets.OPENSEA_API_KEYS }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          HELIUS_API_KEYS: ${{ secrets.HELIUS_API_KEYS }}
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN }}
          UNISAT_API_KEY: ${{ secrets.UNISAT_API_KEY }}
          ORDISCAN_API_KEY: ${{ secrets.ORDISCAN_API_KEY }}
          NEXT_PUBLIC_REFERRAL_ENABLED: ${{ vars.NEXT_PUBLIC_REFERRAL_ENABLED || 'false' }}
          PLANK_PLAYTEST_ENABLED: ${{ vars.PLANK_PLAYTEST_ENABLED || 'false' }}
          PLANK_PLAYTEST_PUBLIC_REGISTRATION: ${{ vars.PLANK_PLAYTEST_PUBLIC_REGISTRATION || 'false' }}
          PLANK_PLAYTEST_ORIGIN: ${{ vars.PLANK_PLAYTEST_ORIGIN || 'https://plank.love' }}
          PLANK_PLAYTEST_RP_ID: ${{ vars.PLANK_PLAYTEST_RP_ID || 'plank.love' }}
          PLANK_PLAYTEST_BOOTSTRAP_HASH: ${{ secrets.PLANK_PLAYTEST_BOOTSTRAP_HASH }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#UNISWAP_API_KEY}" -ge 16
          port="${INMOTION_PORT:-2222}"

          # Retry SSH/SCP. A deploy has failed on `scp: Connection closed`
          # (exit 255) with the box under load average 36 — a dropped
          # connection, not a bad artifact, yet it failed the whole deploy and
          # left production a commit behind. These are idempotent: the upload
          # writes to a SHA-named path and the mkdir is -p.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::transfer attempt $attempt failed, retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            echo "::error::transfer failed after 3 attempts"
            return 1
          }

          runtime_secret="$RUNNER_TEMP/uniswap-api-key"
          umask 077
          printf '%s' "$UNISWAP_API_KEY" > "$runtime_secret"
          retry ssh -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            "mkdir -p '$INMOTION_APP_DIR/incoming' '$INMOTION_APP_DIR/shared/runtime-secrets' && chmod 700 '$INMOTION_APP_DIR/shared/runtime-secrets'"
          retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
            passenger-release.tgz \
            "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/incoming/${RELEASE_SHA}.tgz"
          retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
            "$runtime_secret" \
            "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.uniswap-api-key.${RELEASE_SHA}"
          rm -f "$runtime_secret"
          # Private RPC provider (Alchemy) — optional secret; staged like the
          # Uniswap key (file over scp, never argv) and upserted into the
          # runtime env during activation. Absent secret = keep whatever the
          # server env already has (public-RPC fallback keeps working).
          if [ -n "${RPC_URL:-}" ]; then
            rpc_secret="$RUNNER_TEMP/rpc-url"
            printf '%s' "$RPC_URL" > "$rpc_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$rpc_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.rpc-url.${RELEASE_SHA}"
            rm -f "$rpc_secret"
          fi
          # 0x aggregator key — optional secret, staged exactly like RPC_URL
          # (file over scp, never argv). Absent secret = 0x features stay
          # disabled server-side; the Uniswap path is unaffected.
          if [ -n "${ZEROX_API_KEY:-}" ]; then
            zerox_secret="$RUNNER_TEMP/zerox-api-key"
            printf '%s' "$ZEROX_API_KEY" > "$zerox_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$zerox_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.zerox-api-key.${RELEASE_SHA}"
            rm -f "$zerox_secret"
          fi
          # Multichain NFT discovery key pools (opensea-key-pool.ts /
          # alchemy-key-pool.ts / helius-key-pool.ts) — optional secrets,
          # staged exactly like RPC_URL/ZEROX_API_KEY. Absent secret = that
          # pool stays on whatever the server env already has (OpenSea falls
          # back to its self-managed free key; Alchemy/Helius stay degraded).
          if [ -n "${OPENSEA_API_KEYS:-}" ]; then
            opensea_secret="$RUNNER_TEMP/opensea-api-keys"
            printf '%s' "$OPENSEA_API_KEYS" > "$opensea_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$opensea_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.opensea-api-keys.${RELEASE_SHA}"
            rm -f "$opensea_secret"
          fi
          if [ -n "${ALCHEMY_API_KEY:-}" ]; then
            alchemy_secret="$RUNNER_TEMP/alchemy-api-key"
            printf '%s' "$ALCHEMY_API_KEY" > "$alchemy_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$alchemy_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.alchemy-api-key.${RELEASE_SHA}"
            rm -f "$alchemy_secret"
          fi
          if [ -n "${HELIUS_API_KEYS:-}" ]; then
            helius_secret="$RUNNER_TEMP/helius-api-keys"
            printf '%s' "$HELIUS_API_KEYS" > "$helius_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$helius_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.helius-api-keys.${RELEASE_SHA}"
            rm -f "$helius_secret"
          fi
          # HyperSync + Bitcoin/Ordinals discovery lanes (hypersync-evm-scan.ts,
          # unisat-collection-list-scan.ts, ordiscan-collection-scan.ts) were
          # silently failing on every production refresh pass — confirmed live
          # 2026-08-28 via refresh-market-data.mjs's own error output
          # ("ENVIO_API_TOKEN is not set", "UNISAT_API_KEY is not configured",
          # "ORDISCAN_API_KEY is not configured") — because these three were
          # never staged to the server at all, despite already being live,
          # working keys in local dev. Same optional-secret pattern as the
          # three pools above.
          if [ -n "${ENVIO_API_TOKEN:-}" ]; then
            envio_secret="$RUNNER_TEMP/envio-api-token"
            printf '%s' "$ENVIO_API_TOKEN" > "$envio_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$envio_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.envio-api-token.${RELEASE_SHA}"
            rm -f "$envio_secret"
          fi
          if [ -n "${UNISAT_API_KEY:-}" ]; then
            unisat_secret="$RUNNER_TEMP/unisat-api-key"
            printf '%s' "$UNISAT_API_KEY" > "$unisat_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$unisat_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.unisat-api-key.${RELEASE_SHA}"
            rm -f "$unisat_secret"
          fi
          if [ -n "${ORDISCAN_API_KEY:-}" ]; then
            ordiscan_secret="$RUNNER_TEMP/ordiscan-api-key"
            printf '%s' "$ORDISCAN_API_KEY" > "$ordiscan_secret"
            retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
              "$ordiscan_secret" \
              "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.ordiscan-api-key.${RELEASE_SHA}"
            rm -f "$ordiscan_secret"
          fi
          # Feature flags that are ALSO read server-side.
          #
          # NEXT_PUBLIC_* is inlined into the CLIENT bundle at build time, so
          # the build env above is enough for anything the browser reads. It is
          # NOT enough for a flag a server module reads: in the standalone
          # server `process.env.NEXT_PUBLIC_X` is evaluated at runtime on the
          # box, where the variable does not exist. lib/referral-server.ts is
          # exactly that case, so /api/referral/status kept reporting
          # enabled:false after a build that had the flag set to true, and the
          # panel — which gates on that route, not on its own bundled copy —
          # stayed hidden. Verified in production before this fix.
          #
          # Written UNCONDITIONALLY, unlike the optional secrets above: the
          # value resolves to 'false' when the variable is unset, and turning
          # the flag back off has to overwrite a stale 'true' on the server or
          # rollback silently does nothing.
          flag_file="$RUNNER_TEMP/next-public-flags"
          printf 'NEXT_PUBLIC_REFERRAL_ENABLED=%s\n' "${NEXT_PUBLIC_REFERRAL_ENABLED:-false}" > "$flag_file"
          retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
            "$flag_file" \
            "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.next-public-flags.${RELEASE_SHA}"
          rm -f "$flag_file"

          # Unofficial multiplayer laboratory configuration. This remains
          # server-only: the enable flag fails closed, RP/origin bind legacy
          # WebAuthn rollback routes, and only the high-entropy bootstrap hash
          # (never raw setup or personal PINs) crosses the secret channel.
          playtest_config="$RUNNER_TEMP/playtest-config"
          case "${PLANK_PLAYTEST_ENABLED:-false}" in true|false) ;; *) echo "Invalid PLANK_PLAYTEST_ENABLED." >&2; exit 1 ;; esac
          case "${PLANK_PLAYTEST_PUBLIC_REGISTRATION:-false}" in true|false) ;; *) echo "Invalid PLANK_PLAYTEST_PUBLIC_REGISTRATION." >&2; exit 1 ;; esac
          [[ "$PLANK_PLAYTEST_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]] || { echo "Invalid PLANK_PLAYTEST_ORIGIN." >&2; exit 1; }
          [[ "$PLANK_PLAYTEST_RP_ID" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid PLANK_PLAYTEST_RP_ID." >&2; exit 1; }
          if [ "${PLANK_PLAYTEST_ENABLED:-false}" = true ]; then
            [[ "${PLANK_PLAYTEST_BOOTSTRAP_HASH:-}" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "Enabled playtest requires a SHA-256 bootstrap credential hash." >&2
              exit 1
            }
          fi
          {
            printf 'PLANK_PLAYTEST_ENABLED=%s\n' "${PLANK_PLAYTEST_ENABLED:-false}"
            printf 'PLANK_PLAYTEST_PUBLIC_REGISTRATION=%s\n' "${PLANK_PLAYTEST_PUBLIC_REGISTRATION:-false}"
            printf 'PLANK_PLAYTEST_ORIGIN=%s\n' "${PLANK_PLAYTEST_ORIGIN}"
            printf 'PLANK_PLAYTEST_RP_ID=%s\n' "${PLANK_PLAYTEST_RP_ID}"
            printf 'PLANK_PLAYTEST_BOOTSTRAP_HASH=%s\n' "${PLANK_PLAYTEST_BOOTSTRAP_HASH:-}"
          } > "$playtest_config"
          retry scp -i "$HOME/.ssh/inmotion" -P "$port" \
            "$playtest_config" \
            "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/shared/runtime-secrets/.playtest-config.${RELEASE_SHA}"
          rm -f "$playtest_config"

      - name: Migrate, activate, and restart Passenger
        shell: bash
        run: |
          set -euo pipefail
          port="${INMOTION_PORT:-2222}"
          # pg_dump can be silent for several minutes. Keep transport traffic
          # flowing so the hosting edge cannot reap a healthy backup/migration
          # session as idle (the prior failure repeated at ~4m25s).
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            bash -s -- "$INMOTION_APP_DIR" "$RELEASE_SHA" "$INMOTION_NODE_BIN" <<'REMOTE'
          set -euo pipefail
          trap 'status=$?; echo "Remote activation failed at line $LINENO (exit $status)" >&2; exit "$status"' ERR
          app_dir="$1"
          release_sha="$2"
          node_bin="$3"
          case "$app_dir" in
            /home/*/plank.tanggang.life) ;;
            *) echo "Refusing unexpected INMOTION_APP_DIR: $app_dir" >&2; exit 1 ;;
          esac
          test -x "$node_bin"
          test -f "$app_dir/shared/.env.production"
          staged_uniswap_key="$app_dir/shared/runtime-secrets/.uniswap-api-key.$release_sha"
          test -s "$staged_uniswap_key"
          chmod 600 "$staged_uniswap_key"
          mv -f "$staged_uniswap_key" "$app_dir/shared/runtime-secrets/uniswap-api-key"
          chmod 600 "$app_dir/shared/runtime-secrets/uniswap-api-key"
          # Optional staged RPC_URL: upsert into the runtime env (replace any
          # existing RPC_URL line, then append the staged value). Idempotent;
          # skipped entirely when no file was staged for this release.
          staged_rpc_url="$app_dir/shared/runtime-secrets/.rpc-url.$release_sha"
          if [ -s "$staged_rpc_url" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^RPC_URL=' "$env_file" > "$env_file.next" || true
            printf 'RPC_URL=%s\n' "$(cat "$staged_rpc_url")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_rpc_url"
          fi
          # Same upsert for the optional 0x key.
          staged_zerox_key="$app_dir/shared/runtime-secrets/.zerox-api-key.$release_sha"
          if [ -s "$staged_zerox_key" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^ZEROX_API_KEY=' "$env_file" > "$env_file.next" || true
            printf 'ZEROX_API_KEY=%s\n' "$(cat "$staged_zerox_key")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_zerox_key"
          fi
          # Same upsert for the three optional multichain discovery key
          # pools (see the staging side for which module reads each var).
          staged_opensea_keys="$app_dir/shared/runtime-secrets/.opensea-api-keys.$release_sha"
          if [ -s "$staged_opensea_keys" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^OPENSEA_API_KEYS=' "$env_file" > "$env_file.next" || true
            printf 'OPENSEA_API_KEYS=%s\n' "$(cat "$staged_opensea_keys")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_opensea_keys"
          fi
          staged_alchemy_key="$app_dir/shared/runtime-secrets/.alchemy-api-key.$release_sha"
          if [ -s "$staged_alchemy_key" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^ALCHEMY_API_KEY=' "$env_file" > "$env_file.next" || true
            printf 'ALCHEMY_API_KEY=%s\n' "$(cat "$staged_alchemy_key")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_alchemy_key"
          fi
          staged_helius_keys="$app_dir/shared/runtime-secrets/.helius-api-keys.$release_sha"
          if [ -s "$staged_helius_keys" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^HELIUS_API_KEYS=' "$env_file" > "$env_file.next" || true
            printf 'HELIUS_API_KEYS=%s\n' "$(cat "$staged_helius_keys")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_helius_keys"
          fi
          staged_envio_token="$app_dir/shared/runtime-secrets/.envio-api-token.$release_sha"
          if [ -s "$staged_envio_token" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^ENVIO_API_TOKEN=' "$env_file" > "$env_file.next" || true
            printf 'ENVIO_API_TOKEN=%s\n' "$(cat "$staged_envio_token")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_envio_token"
          fi
          staged_unisat_key="$app_dir/shared/runtime-secrets/.unisat-api-key.$release_sha"
          if [ -s "$staged_unisat_key" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^UNISAT_API_KEY=' "$env_file" > "$env_file.next" || true
            printf 'UNISAT_API_KEY=%s\n' "$(cat "$staged_unisat_key")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_unisat_key"
          fi
          staged_ordiscan_key="$app_dir/shared/runtime-secrets/.ordiscan-api-key.$release_sha"
          if [ -s "$staged_ordiscan_key" ]; then
            env_file="$app_dir/shared/.env.production"
            grep -v '^ORDISCAN_API_KEY=' "$env_file" > "$env_file.next" || true
            printf 'ORDISCAN_API_KEY=%s\n' "$(cat "$staged_ordiscan_key")" >> "$env_file.next"
            chmod 600 "$env_file.next"
            mv -f "$env_file.next" "$env_file"
            rm -f "$staged_ordiscan_key"
          fi
          # Server-side feature flags (see the staging side for why the build
          # env alone is not enough). The staged file is already NAME=value
          # lines, so each is upserted by name rather than hardcoding one.
          staged_flags="$app_dir/shared/runtime-secrets/.next-public-flags.$release_sha"
          if [ -s "$staged_flags" ]; then
            env_file="$app_dir/shared/.env.production"
            while IFS='=' read -r flag_name flag_value; do
              [ -n "$flag_name" ] || continue
              grep -v "^${flag_name}=" "$env_file" > "$env_file.next" || true
              printf '%s=%s\n' "$flag_name" "$flag_value" >> "$env_file.next"
              chmod 600 "$env_file.next"
              mv -f "$env_file.next" "$env_file"
            done < "$staged_flags"
            rm -f "$staged_flags"
          fi
          staged_playtest="$app_dir/shared/runtime-secrets/.playtest-config.$release_sha"
          if [ -s "$staged_playtest" ]; then
            env_file="$app_dir/shared/.env.production"
            while IFS='=' read -r config_name config_value; do
              case "$config_name" in
                PLANK_PLAYTEST_ENABLED|PLANK_PLAYTEST_PUBLIC_REGISTRATION|PLANK_PLAYTEST_ORIGIN|PLANK_PLAYTEST_RP_ID|PLANK_PLAYTEST_BOOTSTRAP_HASH) ;;
                *) echo "Refusing unexpected playtest config key." >&2; exit 1 ;;
              esac
              grep -v "^${config_name}=" "$env_file" > "$env_file.next" || true
              printf '%s=%s\n' "$config_name" "$config_value" >> "$env_file.next"
              chmod 600 "$env_file.next"
              mv -f "$env_file.next" "$env_file"
            done < "$staged_playtest"
            rm -f "$staged_playtest"
          fi
          release_dir="$app_dir/releases/$release_sha"
          mkdir -p "$release_dir" "$app_dir/shared" "$app_dir/tmp" "$app_dir/logs"
          tar -xzf "$app_dir/incoming/$release_sha.tgz" -C "$release_dir"
          test -f "$release_dir/server.js"
          test -f "$release_dir/scripts/migrate-postgres.mjs"
          test -f "$release_dir/scripts/backup-postgres.mjs"

          # Back up BEFORE migrating. Migrations are append-only, but a bad
          # one — or a hand-run query afterwards — is otherwise unrecoverable,
          # and a normal deploy would otherwise apply schema changes with no
          # rollback point. This fails the deploy if it cannot produce a
          # non-empty dump.
          if ! command -v pg_dump >/dev/null 2>&1; then
            echo "pg_dump not found on the server - cannot take a pre-migration backup." >&2
            exit 1
          fi
          INMOTION_APP_DIR="$app_dir" \
          PLANK_BACKUP_DIR="$app_dir/shared/backups" \
          PLANK_BACKUP_LABEL="predeploy" \
          PLANK_BACKUP_KEEP=14 \
            "$node_bin" \
              --env-file="$app_dir/shared/.env.production" \
              "$release_dir/scripts/backup-postgres.mjs"

          "$node_bin" \
            --env-file="$app_dir/shared/.env.production" \
            "$release_dir/scripts/migrate-postgres.mjs"

          if [ -L "$app_dir/current" ]; then
            readlink "$app_dir/current" > "$app_dir/.previous-release"
          else
            : > "$app_dir/.previous-release"
          fi
          cp "$release_dir/deploy/inmotion/passenger.cjs" "$app_dir/passenger.cjs"
          cp "$release_dir/deploy/inmotion/passenger.cjs" "$app_dir/passenger.js"
          rm -f "$app_dir/current.next"
          ln -s "releases/$release_sha" "$app_dir/current.next"
          mv -Tf "$app_dir/current.next" "$app_dir/current"
          rm -f "$app_dir/incoming/$release_sha.tgz"
          touch "$app_dir/tmp/restart.txt"
          REMOTE

      - name: Verify public health or roll back
        shell: bash
        run: |
          set -euo pipefail
          healthy=false
          health_body=""
          trade_body=""
          market_body=""
          market_deployment=""
          for attempt in $(seq 1 36); do
            if health_body="$(
                 curl --fail --silent --show-error \
                   --connect-timeout 5 --max-time 15 \
                   --user-agent "Mozilla/5.0 (compatible; PlankDeploy/1.0)" \
                   --header "Accept: application/json" \
                   --header "Cache-Control: no-cache" \
                   --header "Pragma: no-cache" \
                   "$INMOTION_HEALTH_URL/api/health?deployment=$RELEASE_SHA&attempt=$attempt"
                )" &&
               trade_body="$(
                 curl --fail --silent --show-error \
                   --connect-timeout 5 --max-time 15 \
                   --user-agent "Mozilla/5.0 (compatible; PlankDeploy/1.0)" \
                   --header "Accept: application/json" \
                   --header "Cache-Control: no-cache" \
                   --header "Pragma: no-cache" \
                   "$INMOTION_HEALTH_URL/api/trade/status?deployment=$RELEASE_SHA&attempt=$attempt"
               )" &&
               [[ "$health_body" == *'"ok":true'* ]] &&
               [[ "$health_body" == *'"storage":"postgres"'* ]] &&
               [[ "$health_body" == *"\"version\":\"$RELEASE_SHA\""* ]] &&
               [[ "$trade_body" == *'"tradingApiConfigured":true'* ]] &&
               market_body="$(
                 curl --fail --silent --show-error \
                   --connect-timeout 5 --max-time 15 \
                   --user-agent "Mozilla/5.0 (compatible; PlankDeploy/1.0)" \
                   --header "Accept: text/html" \
                   --header "Cache-Control: no-cache" \
                   --header "Pragma: no-cache" \
                   "$INMOTION_HEALTH_URL/market?tab=swap"
               )" &&
               market_deployment="$(
                 printf '%s' "$market_body" |
                   grep -o 'data-deployment="[^"]*"' |
                   head -n 1 || true
               )" &&
               [[ "$market_deployment" == "data-deployment=\"$RELEASE_SHA\"" ]]; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" = true ]; then
            exit 0
          fi

          echo "::error::Public deployment verification did not observe release $RELEASE_SHA after 36 attempts."
          echo "Last public health response: $health_body"
          echo "Last public trade status response: $trade_body"
          echo "Last canonical market deployment marker: ${market_deployment:-missing}"

          port="${INMOTION_PORT:-2222}"
          ssh -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            bash -s -- "$INMOTION_APP_DIR" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          previous="$(cat "$app_dir/.previous-release")"
          if [ -n "$previous" ]; then
            rm -f "$app_dir/current.rollback"
            ln -s "$previous" "$app_dir/current.rollback"
            mv -Tf "$app_dir/current.rollback" "$app_dir/current"
            touch "$app_dir/tmp/restart.txt"
            echo "Deployment health check failed; previous release restored." >&2
          else
            echo "Deployment health check failed; no previous release exists." >&2
          fi
          REMOTE
          exit 1

  provision-relayer:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'provision-relayer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: inmotion-staging
    env:
      INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
      INMOTION_PORT: ${{ secrets.INMOTION_PORT }}
      INMOTION_USER: ${{ secrets.INMOTION_USER }}
      INMOTION_SSH_KEY: ${{ secrets.INMOTION_SSH_KEY }}
      INMOTION_HOST_KEY: ${{ secrets.INMOTION_HOST_KEY }}
      INMOTION_APP_DIR: ${{ vars.INMOTION_APP_DIR }}
      INMOTION_NODE_BIN: ${{ vars.INMOTION_NODE_BIN }}
      RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
      RELAY_VAULT_ADDRESSES: ${{ vars.RELAY_VAULT_ADDRESSES }}
    steps:
      - name: Validate relayer and SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELAYER_PRIVATE_KEY" =~ ^0x[0-9a-fA-F]{64}$ ]]
          test -n "$INMOTION_HOST"
          test -n "$INMOTION_USER"
          test -n "$INMOTION_SSH_KEY"
          test -n "$INMOTION_HOST_KEY"
          test -n "$INMOTION_APP_DIR"
          test -n "$INMOTION_NODE_BIN"
          test -n "$RELAY_VAULT_ADDRESSES"

      - name: Configure trusted SSH host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$INMOTION_SSH_KEY" > "$HOME/.ssh/inmotion"
          printf '%s\n' "$INMOTION_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/inmotion" "$HOME/.ssh/known_hosts"

      - name: Transfer cron-only key and repoint cPanel cron
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          relayer_env="$RUNNER_TEMP/relayer.env"
          {
            printf 'RELAYER_PRIVATE_KEY=%s\n' "$RELAYER_PRIVATE_KEY"
            printf 'RPC_URL=%s\n' 'https://rpc.mainnet.chain.robinhood.com'
            printf 'BEACON_ADDRESS=%s\n' '0x87d584df130FED0Fe540954eD48CE2691A18D619'
            printf 'DRAND_CHAIN_HASH=%s\n' '04f1e9062b8a81f848fded9c12306733282b2727ecced50032187751166ec8c3'
            printf 'VAULT_ADDRESSES=%s\n' "$RELAY_VAULT_ADDRESSES"
          } > "$relayer_env"
          port="${INMOTION_PORT:-2222}"
          staged="$INMOTION_APP_DIR/shared/runtime-secrets/.relayer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          ssh -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            "mkdir -p '$INMOTION_APP_DIR/shared/runtime-secrets' && chmod 700 '$INMOTION_APP_DIR/shared/runtime-secrets'"
          scp -i "$HOME/.ssh/inmotion" -P "$port" \
            "$relayer_env" "${INMOTION_USER}@${INMOTION_HOST}:${staged}"
          rm -f "$relayer_env"

          ssh -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            bash -s -- "$INMOTION_APP_DIR" "$INMOTION_NODE_BIN" "$staged" "$RELAY_VAULT_ADDRESSES" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          node_bin="$2"
          staged="$3"
          expected_vaults="$4"
          case "$app_dir" in
            /home/*/plank.tanggang.life) ;;
            *) echo "Refusing unexpected application directory." >&2; exit 1 ;;
          esac
          cleanup() { rm -f "$staged"; }
          trap cleanup EXIT
          test -x "$node_bin"
          test -s "$staged"
          artifact="$app_dir/current/ops/drand-relayer/relay-drand.mjs"
          verifier="$app_dir/current/ops/drand-relayer/verify-log.mjs"
          test -s "$artifact"
          test -s "$verifier"
          if grep -q '^RELAYER_PRIVATE_KEY=' "$app_dir/shared/.env.production"; then
            echo "RELAYER_PRIVATE_KEY must not be in Passenger .env.production." >&2
            exit 1
          fi

          secret_dir="$app_dir/shared/runtime-secrets"
          secret_file="$secret_dir/relayer.env"
          logs_dir="$app_dir/logs"
          log_file="$logs_dir/drand-relayer.log"
          lock_file="$app_dir/shared/drand-relayer.lock"
          mkdir -p "$secret_dir" "$logs_dir"
          chmod 700 "$secret_dir"
          chmod 700 "$logs_dir"
          chmod 600 "$staged"
          mv -f "$staged" "$secret_file"
          chmod 600 "$secret_file"
          touch "$log_file"
          chmod 600 "$log_file"
          flock_bin="$(command -v flock)"
          test -x "$flock_bin"

          "$flock_bin" -w 55 "$lock_file" \
            "$node_bin" --env-file="$secret_file" "$artifact" \
            >> "$log_file" 2>&1
          "$node_bin" "$verifier" \
            --require-hours=0 --max-age-minutes=10 \
            --vault-addresses="$expected_vaults" "$log_file"

          cron_before="$(mktemp)"
          cron_after="$(mktemp)"
          trap 'rm -f "$staged" "$cron_before" "$cron_after"' EXIT
          crontab -l > "$cron_before" 2>/dev/null || true
          old_relay_count="$(grep -Ec 'relay-drand|drand-relayer' "$cron_before" || true)"
          awk '!/plank-drand-relayer/ && !/relay-drand/ && !/drand-relayer/' \
            "$cron_before" > "$cron_after"
          {
            printf '%s\n' '# plank-drand-relayer (managed by inmotion branch)'
            printf '* * * * * %s -n %s %s --env-file=%s %s >> %s 2>&1\n' \
              "$flock_bin" "$lock_file" "$node_bin" "$secret_file" \
              "$artifact" "$log_file"
          } >> "$cron_after"
          crontab "$cron_after"
          managed_count="$(crontab -l | grep -c 'plank-drand-relayer' || true)"
          test "$managed_count" -eq 1
          test "$(stat -c '%a' "$secret_dir")" = "700"
          test "$(stat -c '%a' "$secret_file")" = "600"

          status_before="$(grep -c 'RELAYER_STATUS=' "$log_file" || true)"
          cron_observed=false
          for attempt in $(seq 1 18); do
            sleep 5
            status_after="$(grep -c 'RELAYER_STATUS=' "$log_file" || true)"
            if [ "$status_after" -gt "$status_before" ]; then
              cron_observed=true
              break
            fi
          done
          test "$cron_observed" = "true"
          "$node_bin" "$verifier" \
            --require-hours=0 --max-age-minutes=10 "$log_file"
          echo "RELAYER_PROVISIONED={\"oldRelayLines\":$old_relay_count,\"managedEntries\":$managed_count}"
          tail -n 3 "$log_file"
          REMOTE

  verify-relayer:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'verify-relayer'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: inmotion-staging
    env:
      INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
      INMOTION_PORT: ${{ secrets.INMOTION_PORT }}
      INMOTION_USER: ${{ secrets.INMOTION_USER }}
      INMOTION_SSH_KEY: ${{ secrets.INMOTION_SSH_KEY }}
      INMOTION_HOST_KEY: ${{ secrets.INMOTION_HOST_KEY }}
      INMOTION_APP_DIR: ${{ vars.INMOTION_APP_DIR }}
      INMOTION_NODE_BIN: ${{ vars.INMOTION_NODE_BIN }}
      RELAY_VAULT_ADDRESSES: ${{ vars.RELAY_VAULT_ADDRESSES }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate disable confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DISABLE_GITHUB_RELAY"
          test -n "$RELAY_VAULT_ADDRESSES"

      - name: Configure trusted SSH host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$INMOTION_SSH_KEY" > "$HOME/.ssh/inmotion"
          printf '%s\n' "$INMOTION_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/inmotion" "$HOME/.ssh/known_hosts"

      - name: Verify 24 hours of InMotion relay health
        shell: bash
        run: |
          set -euo pipefail
          port="${INMOTION_PORT:-2222}"
          ssh -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            bash -s -- "$INMOTION_APP_DIR" "$INMOTION_NODE_BIN" "$RELAY_VAULT_ADDRESSES" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          node_bin="$2"
          expected_vaults="$3"
          case "$app_dir" in
            /home/*/plank.tanggang.life) ;;
            *) echo "Refusing unexpected application directory." >&2; exit 1 ;;
          esac
          secret_dir="$app_dir/shared/runtime-secrets"
          secret_file="$secret_dir/relayer.env"
          artifact="$app_dir/current/ops/drand-relayer/relay-drand.mjs"
          verifier="$app_dir/current/ops/drand-relayer/verify-log.mjs"
          log_file="$app_dir/logs/drand-relayer.log"
          lock_file="$app_dir/shared/drand-relayer.lock"
          test "$(stat -c '%a' "$secret_dir")" = "700"
          test "$(stat -c '%a' "$secret_file")" = "600"
          test -s "$artifact"
          test -s "$verifier"
          test "$(crontab -l | grep -c 'plank-drand-relayer')" -eq 1
          flock_bin="$(command -v flock)"
          "$flock_bin" -w 55 "$lock_file" \
            "$node_bin" --env-file="$secret_file" "$artifact" \
            >> "$log_file" 2>&1
          "$node_bin" "$verifier" \
            --require-hours=24 --max-age-minutes=10 \
            --vault-addresses="$expected_vaults" "$log_file"
          REMOTE

      - name: Disable the GitHub scheduled relay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/relay-drand.yml/disable"
          state="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/relay-drand.yml" \
              --jq '.state'
