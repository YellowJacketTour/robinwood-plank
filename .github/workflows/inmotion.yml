name: InMotion CI/CD

on:
  pull_request:
    branches:
      - master
      - inmotion
  push:
    branches:
      - inmotion
  workflow_dispatch: {}

concurrency:
  group: inmotion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_MARKET_ENABLED: "true"
      NEXT_PUBLIC_MARKET_VAULT_ADDRESS: "0xc4B29D7a01603D2A5937b1FC86ea85E488d72e04"
      NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESS: "0xb2019Fd4cA24502e812C0C73b751Fa49979BF708"
      NEXT_PUBLIC_RULES_RELAXED: "true"
      NEXT_PUBLIC_TRADE_PAUSED: "false"
      DEPLOYMENT_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repository's full lint command has a pre-existing error baseline.
      # Keep deployment-specific changes gated without masking that baseline.
      - run: npm run lint:inmotion
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  image:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "rolling=ghcr.io/${repository}:inmotion" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        shell: bash
        run: |
          printf '%s' "${{ github.token }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          ROLLING_IMAGE: ${{ steps.meta.outputs.rolling }}
          NEXT_PUBLIC_MARKET_ENABLED: ${{ vars.NEXT_PUBLIC_MARKET_ENABLED }}
          NEXT_PUBLIC_MARKET_VAULT_ADDRESS: ${{ vars.NEXT_PUBLIC_MARKET_VAULT_ADDRESS }}
          NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESS: ${{ vars.NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESS }}
          NEXT_PUBLIC_MINT_START_AT: ${{ vars.NEXT_PUBLIC_MINT_START_AT }}
          NEXT_PUBLIC_ROBINHOOD_RPC_URL: ${{ vars.NEXT_PUBLIC_ROBINHOOD_RPC_URL }}
          NEXT_PUBLIC_RULES_RELAXED: ${{ vars.NEXT_PUBLIC_RULES_RELAXED }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TRADE_OPENS_AT: ${{ vars.NEXT_PUBLIC_TRADE_OPENS_AT }}
          NEXT_PUBLIC_TRADE_PAUSED: ${{ vars.NEXT_PUBLIC_TRADE_PAUSED }}
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
        run: |
          set -euo pipefail
          args=(
            --platform linux/amd64
            --build-arg "DEPLOYMENT_VERSION=${GITHUB_SHA}"
            --tag "$IMAGE"
            --tag "$ROLLING_IMAGE"
          )
          public_vars=(
            NEXT_PUBLIC_MARKET_ENABLED
            NEXT_PUBLIC_MARKET_VAULT_ADDRESS
            NEXT_PUBLIC_MARKET_VAULT_LEGACY_ADDRESS
            NEXT_PUBLIC_MINT_START_AT
            NEXT_PUBLIC_ROBINHOOD_RPC_URL
            NEXT_PUBLIC_RULES_RELAXED
            NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_TRADE_OPENS_AT
            NEXT_PUBLIC_TRADE_PAUSED
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
          )
          for name in "${public_vars[@]}"; do
            if [ -n "${!name:-}" ]; then
              args+=(--build-arg "${name}=${!name}")
            fi
          done
          docker build "${args[@]}" .
      - name: Push immutable and rolling tags
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          ROLLING_IMAGE: ${{ steps.meta.outputs.rolling }}
        run: |
          docker push "$IMAGE"
          docker push "$ROLLING_IMAGE"

  deploy:
    needs: image
    if: >-
      vars.INMOTION_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: inmotion-production
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
      INMOTION_PORT: ${{ secrets.INMOTION_PORT }}
      INMOTION_USER: ${{ secrets.INMOTION_USER }}
      INMOTION_SSH_KEY: ${{ secrets.INMOTION_SSH_KEY }}
      INMOTION_HOST_KEY: ${{ secrets.INMOTION_HOST_KEY }}
      INMOTION_APP_DIR: ${{ vars.INMOTION_APP_DIR || '/opt/plank-love' }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure trusted SSH host
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INMOTION_HOST"
          test -n "$INMOTION_USER"
          test -n "$INMOTION_SSH_KEY"
          test -n "$INMOTION_HOST_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$INMOTION_SSH_KEY" > "$HOME/.ssh/inmotion"
          printf '%s\n' "$INMOTION_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/inmotion" "$HOME/.ssh/known_hosts"
      - name: Copy deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          port="${INMOTION_PORT:-22}"
          ssh -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            "test -d '$INMOTION_APP_DIR' && test -f '$INMOTION_APP_DIR/.env.inmotion'"
          scp -i "$HOME/.ssh/inmotion" -P "$port" \
            docker-compose.inmotion.yml \
            "${INMOTION_USER}@${INMOTION_HOST}:${INMOTION_APP_DIR}/docker-compose.inmotion.yml"
      - name: Authenticate VPS to private GHCR package
        if: env.GHCR_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          port="${INMOTION_PORT:-22}"
          printf '%s' "$GHCR_READ_TOKEN" |
            ssh -i "$HOME/.ssh/inmotion" -p "$port" \
              "${INMOTION_USER}@${INMOTION_HOST}" \
              "docker login ghcr.io -u '$GHCR_READ_USER' --password-stdin"
      - name: Roll out immutable image and verify health
        shell: bash
        run: |
          set -euo pipefail
          port="${INMOTION_PORT:-22}"
          ssh -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            bash -s -- "$INMOTION_APP_DIR" "$IMAGE" <<'REMOTE'
          set -euo pipefail
          app_dir="$1"
          image="$2"
          cd "$app_dir"
          export PLANK_IMAGE="$image"
          compose=(docker compose --env-file .env.inmotion -f docker-compose.inmotion.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull app valkey
          "${compose[@]}" up -d --no-build --remove-orphans app valkey
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/trade/status >/dev/null; then
              "${compose[@]}" ps
              exit 0
            fi
            sleep 5
          done
          "${compose[@]}" logs --tail=150 app
          exit 1
          REMOTE
