          test "$state" = "disabled_manually"
          echo "GitHub relay workflow disabled after verified InMotion takeover."

  # ---------------------------------------------------------------------------
  # Runtime admin allowlist.
  #
  # PLANK_ADMIN_ADDRESSES gates every /admin mutation. It is read per request,
  # not baked into the bundle, so it lives in the server's shared/.env.production
  # rather than the build env — and CI otherwise never touches that file.
  #
  # This job exists so the allowlist can be changed without anyone holding a
  # shell on the box: the deploy key stays a secret the workflow uses and no
  # human reads. The addresses themselves are public on-chain wallets, so they
  # come from a repository variable (or a dispatch input), not a secret.
  #
  # The remote script rewrites in place rather than appending: a second
  # PLANK_ADMIN_ADDRESSES= line would silently shadow the first, which is the
  # kind of bug that only shows up as "why is my wallet still rejected".
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Season 2 $PLANK King of the Hill ("Biggest Buyer Board") standalone watcher
  # cron. See scripts/plank-koth-watch-standalone.ts's own header for the full
  # "why": that script deliberately has zero dependency on the multichain
  # mesh-tick job scheduler (docs/INMOTION_DEPLOYMENT.md's own documented
  # manual cron line for scripts/mesh-tick.ts), so the KOTH backend can run
  # standalone. Modeled closely on provision-relayer above (same SSH setup,
  # same idempotent managed-crontab-block rewrite, same verify-before-trust
  # discipline: run it once synchronously and confirm real log output before
  # ever installing the recurring schedule) -- simpler than that job because
  # this script needs no separate secret file, just the app's own existing
  # shared/.env.production (already used for every other production cron).
  # ---------------------------------------------------------------------------
  provision-plank-koth-watch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'provision-plank-koth-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: inmotion-staging
    env:
      INMOTION_HOST: ${{ secrets.INMOTION_HOST }}
      INMOTION_PORT: ${{ secrets.INMOTION_PORT }}
      INMOTION_USER: ${{ secrets.INMOTION_USER }}
      INMOTION_SSH_KEY: ${{ secrets.INMOTION_SSH_KEY }}
      INMOTION_HOST_KEY: ${{ secrets.INMOTION_HOST_KEY }}
      INMOTION_APP_DIR: ${{ vars.INMOTION_APP_DIR }}
      INMOTION_NODE_BIN: ${{ vars.INMOTION_NODE_BIN }}
    steps:
      - name: Validate SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INMOTION_HOST"
          test -n "$INMOTION_USER"
          test -n "$INMOTION_SSH_KEY"
          test -n "$INMOTION_HOST_KEY"
          test -n "$INMOTION_APP_DIR"
          test -n "$INMOTION_NODE_BIN"

      - name: Configure trusted SSH host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$INMOTION_SSH_KEY" > "$HOME/.ssh/inmotion"
          printf '%s\n' "$INMOTION_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/inmotion" "$HOME/.ssh/known_hosts"

      - name: Run once, then install the managed cron entry
        shell: bash
        run: |
          set -euo pipefail
          port="${INMOTION_PORT:-2222}"
          ssh -v -o ConnectTimeout=15 -o BatchMode=yes -i "$HOME/.ssh/inmotion" -p "$port" \
            "${INMOTION_USER}@${INMOTION_HOST}" \
            bash -s -- "$INMOTION_APP_DIR" "$INMOTION_NODE_BIN" <<'REMOTE'
          echo "REACHED REMOTE SHELL"
          set -euxo pipefail
          app_dir="$1"
          node_bin="$2"
          case "$app_dir" in
            /home/*/plank.tanggang.life) ;;
            *) echo "Refusing unexpected application directory." >&2; exit 1 ;;
          esac
          test -x "$node_bin"

          env_file="$app_dir/shared/.env.production"
          test -s "$env_file"
          # The standalone Next.js release tree ships no devDependencies at
          # all (npx does not exist next to node there either, confirmed
          # 2026-08-26) -- there is no tsx and never will be. This script
          # runs from the esbuild-bundled .mjs (package.json's own
          # build:plank-koth-watch), same convention as reindex-chain-
          # events.mjs/refresh-market-data.mjs, not the raw .ts source.
          artifact="$app_dir/current/scripts/plank-koth-watch-standalone.mjs"
          test -s "$artifact"

          logs_dir="$app_dir/logs"
          log_file="$logs_dir/plank-koth-watch.log"
          lock_file="$app_dir/shared/plank-koth-watch.lock"
          mkdir -p "$logs_dir"
          chmod 700 "$logs_dir"
          touch "$log_file"
          chmod 600 "$log_file"

          flock_bin="$(command -v flock)"
          test -x "$flock_bin"

          # Prove one real pass actually succeeds BEFORE installing the
          # recurring schedule -- a broken script must never get scheduled
          # to fail silently every two minutes with nobody watching.
          cd "$app_dir/current"
          "$flock_bin" -w 55 "$lock_file" \
            "$node_bin" --env-file="$env_file" "$artifact" \
            >> "$log_file" 2>&1
          tail -n 5 "$log_file"

          cron_before="$(mktemp)"
          cron_after="$(mktemp)"
          trap 'rm -f "$cron_before" "$cron_after"' EXIT
          crontab -l > "$cron_before" 2>/dev/null || true
          awk '!/plank-koth-watch/' "$cron_before" > "$cron_after"
          {
            printf '%s\n' '# plank-koth-watch (managed by inmotion branch)'
            printf '*/2 * * * * cd %s && %s -n %s %s --env-file=%s %s >> %s 2>&1\n' \
              "$app_dir/current" "$flock_bin" "$lock_file" "$node_bin" "$env_file" \
              "$artifact" "$log_file"
          } >> "$cron_after"
          crontab "$cron_after"
          # Count only the tag comment line, not the substring match against
          # the schedule line too -- unlike provision-relayer's own tag
          # ("plank-drand-relayer", which never collides with that job's
          # artifact path), this artifact's own filename
          # (plank-koth-watch-standalone.mjs) legitimately contains
          # "plank-koth-watch", so a bare substring grep double-counts one
          # real managed entry as two. Confirmed live 2026-08-26:
          # managed_count=2 for a single real entry with the bare grep.
          managed_count="$(crontab -l | grep -c '^# plank-koth-watch' || true)"
          test "$managed_count" -eq 1

          # Confirm the cron actually fires on its own before declaring
          # success -- same real "don't trust the schedule until it's been
          # observed running" discipline provision-relayer already uses.
          lines_before="$(wc -l < "$log_file")"
          cron_observed=false
          for attempt in $(seq 1 30); do
            sleep 5
            lines_after="$(wc -l < "$log_file")"
            if [ "$lines_after" -gt "$lines_before" ]; then
              cron_observed=true
              break
            fi
          done
          test "$cron_observed" = "true"
          echo "PLANK_KOTH_WATCH_PROVISIONED={\"managedEntries\":$managed_count}"
          tail -n 5 "$log_file"
          REMOTE

