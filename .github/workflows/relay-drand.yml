name: Relay drand rounds

# Keeps pending vault redemptions resolving without anyone keeping a laptop
# open. Fully permissionless and non-custodial of anything that matters:
# scripts/relay-drand.ts forwards a round drand ALREADY published to the
# whole world over plain HTTP; contracts/DrandBeacon.sol verifies the BLS
# signature on-chain before accepting it. This workflow cannot influence a
# redemption outcome — it can only be early, late, or redundant with someone
# else's submission (the first valid one wins, the rest are cheap no-ops).
#
# The only secret involved is RELAYER_PRIVATE_KEY: a throwaway, gas-only
# wallet with no special privilege over the vault. It never touches an AI
# assistant, never touches this repo's source, and lives only in GitHub's
# encrypted secret store (Settings -> Secrets and variables -> Actions),
# masked in every log line automatically. Fund it with a small amount of ETH
# for gas and nothing else — never point this at a deploy or treasury key.

on:
  schedule:
    # Every 10 minutes. The vault's forfeit window is ~24h, so this is a
    # wide margin for prompt redemption resolution without wasting Actions
    # minutes on drand's ~3s round cadence.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json was generated with npm 11.6.2. Both npm 10 (bundled
      # with Node 20) and npm 11.18.0 disagree with it on optional-dependency
      # resolution and fail `npm ci` outright ("Missing: @emnapi/... from
      # lock file") — confirmed by reproducing locally with each version.
      # Pin to the exact version that works until the lockfile is next
      # regenerated and re-verified against npm ci.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Relay latest drand round
        env:
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          RPC_URL: https://rpc.mainnet.chain.robinhood.com
          BEACON_ADDRESS: ${{ vars.DRAND_BEACON_ADDRESS }}
          DRAND_CHAIN_HASH: "04f1e9062b8a81f848fded9c12306733282b2727ecced50032187751166ec8c3"
        run: npx tsx scripts/relay-drand.ts
