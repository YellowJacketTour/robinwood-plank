name: Relay drand rounds

# Temporary GitHub fallback for random-redemption maintenance while the
# InMotion cPanel cron proves a 24-hour healthy window. The manual
# verify-relayer operation disables this workflow after takeover. The script
# spends gas only when a vault has an actionable request; idle runs are reads.
#
# Secrets:
#   RELAYER_PRIVATE_KEY — dedicated gas-only throwaway wallet

on:
  schedule:
    # GitHub's shortest supported schedule interval is five minutes; queued
    # scheduled jobs may still be delayed during periods of high load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  relay-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Conditional vault settle via relayer key
        env:
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          RPC_URL: https://rpc.mainnet.chain.robinhood.com
          BEACON_ADDRESS: "0x87d584df130FED0Fe540954eD48CE2691A18D619"
          DRAND_CHAIN_HASH: "04f1e9062b8a81f848fded9c12306733282b2727ecced50032187751166ec8c3"
          VAULT_ADDRESSES: "0xc4B29D7a01603D2A5937b1FC86ea85E488d72e04,0xb2019Fd4cA24502e812C0C73b751Fa49979BF708"
        run: npx tsx scripts/relay-drand.ts
