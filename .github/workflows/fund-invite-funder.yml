# One-shot: move testnet gas from the DEPLOYER to the gateway's funder wallet.
#
# Why a separate wallet at all. The deployer key owns the casino contracts, and
# testnet-casino-setup.ts states the rule plainly: "Never publish the deployment
# key." The gateway is a long-lived internet-facing service holding its signer
# in memory for as long as the table is up, so it gets a wallet whose only
# ability is to hold gas and mint test PLANK. If that key ever leaks, the loss
# is a faucet top-up, not the deployment.
#
# Run from the Actions tab. It is deliberately manual and deliberately capped.
name: Fund invite funder (testnet)

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'ETH to send (testnet 46630). 0.21 funds ~100 players.'
        required: true
        default: '0.25'

jobs:
  fund:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i ethers@6 --no-save
      - name: Send
        env:
          DEPLOYER_PK_TESTNET: ${{ secrets.DEPLOYER_PK_TESTNET }}
          PLANK_INVITE_FUNDER_PK: ${{ secrets.PLANK_INVITE_FUNDER_PK }}
          AMOUNT: ${{ inputs.amount }}
        run: |
          node -e '
          const {Wallet,JsonRpcProvider,parseEther,formatEther}=require("ethers");
          (async()=>{
            const rpc=new JsonRpcProvider("https://rpc.testnet.chain.robinhood.com");
            const net=await rpc.getNetwork();
            // Never let this run against anything but the declared test chain.
            if(net.chainId!==46630n)throw new Error("Refusing: chain "+net.chainId+" is not testnet 46630");
            const amount=parseEther(process.env.AMOUNT.trim());
            if(amount>parseEther("1"))throw new Error("Refusing: over the 1 ETH cap");
            const from=new Wallet(process.env.DEPLOYER_PK_TESTNET.trim(),rpc);
            const to=new Wallet(process.env.PLANK_INVITE_FUNDER_PK.trim()).address;
            console.log("funder:",to);
            console.log("before:",formatEther(await rpc.getBalance(to)));
            const tx=await from.sendTransaction({to,value:amount});
            console.log("tx:",tx.hash);
            await tx.wait();
            console.log("after :",formatEther(await rpc.getBalance(to)));
          })().catch(e=>{console.error(e.message);process.exit(1)});'
