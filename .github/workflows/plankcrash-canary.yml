name: PlankCrash testnet canary

on:
  workflow_dispatch:
    inputs:
      signed_write:
        description: "Send one zero-value self-transaction on Robinhood testnet"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Observe Robinhood testnet
        env:
          ROBINHOOD_TESTNET_RPC_URL: ${{ vars.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_TESTNET_WS_URL: ${{ vars.ROBINHOOD_TESTNET_WS_URL }}
          PLANKCRASH_CANARY_PRIVATE_KEY: ${{ inputs.signed_write && secrets.PLANKCRASH_CANARY_PRIVATE_KEY || '' }}
        run: npm run plankcrash:canary -- --out=plankcrash-canary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plankcrash-canary-${{ github.run_id }}
          path: plankcrash-canary.json
          if-no-files-found: warn
          retention-days: 90

