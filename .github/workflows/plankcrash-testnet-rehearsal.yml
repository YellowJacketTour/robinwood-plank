name: PlankCrash testnet rehearsal

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_only:
        description: "Type ROBINHOOD-TESTNET-ONLY"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plankcrash-testnet-rehearsal
  cancel-in-progress: false

jobs:
  seedless-rehearsal:
    if: ${{ inputs.confirm_testnet_only == 'ROBINHOOD-TESTNET-ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOYER_PK: ${{ secrets.DEPLOYER_PK_TESTNET }}
      ROBINHOOD_TESTNET_RPC_URL: ${{ vars.ROBINHOOD_TESTNET_RPC_URL }}
      ROBINHOOD_TESTNET_CHAIN_ID: ${{ vars.ROBINHOOD_TESTNET_CHAIN_ID }}
      SEEDLESS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Refuse unsafe or incomplete configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${ROBINHOOD_TESTNET_CHAIN_ID}" = "46630"
          test -n "${ROBINHOOD_TESTNET_RPC_URL}"
          test -n "${DEPLOYER_PK}"
          test "${ROBINHOOD_TESTNET_RPC_URL}" != "https://rpc.mainnet.chain.robinhood.com"

      - run: npm ci
      - run: npx hardhat compile
      - run: npm run test:contracts

      - name: Deploy seedless private-alpha stack to Robinhood testnet
        shell: bash
        run: |
          set -euo pipefail
          npx hardhat run scripts/testnet-casino-setup.ts --network robinhood-testnet 2>&1 | tee plankcrash-testnet-deploy.log

      - name: Exercise fresh-stack lifecycle and collect signed receipt gas
        shell: bash
        env:
          PLANKCRASH_TESTNET_MANIFEST: public/arcade/deploy-addresses.testnet.json
          PLANKCRASH_CANARY_EVIDENCE: artifacts/plankcrash-testnet-canary/evidence.json
          CANARY_EXERCISE_FRESH_ROUND: "1"
        run: |
          set -euo pipefail
          npx hardhat run scripts/plankcrash-testnet-canary.ts --network robinhood-testnet
          ! grep -Eiq 'private.?key|simulateKey|DEPLOYER_PK' artifacts/plankcrash-testnet-canary/evidence.json

      - name: Upload non-secret rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plankcrash-testnet-rehearsal-${{ github.run_id }}
          path: plankcrash-testnet-deploy.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload signed canary and gas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plankcrash-testnet-canary-${{ github.run_id }}
          path: artifacts/plankcrash-testnet-canary/evidence.json
          if-no-files-found: warn
          retention-days: 90
