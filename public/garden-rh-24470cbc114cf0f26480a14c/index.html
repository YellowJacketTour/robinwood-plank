<style>
/* ── COLOUR LAW ────────────────────────────────────────────────────────────

  --s:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   THE ENGINE IS RUST. THIS FILE CONTAINS NO PROTOCOL ARITHMETIC.

   Every protocol number this page displays is computed by
   `programs/exchange-core`, compiled to wasm32 and inlined below as base64.
   The same Rust emits `evm/differential/vectors.json`, and
   `sim/verify-page-math.js` lifts the payload back out of this very file and
   drives it against those vectors — so the page and the contracts are not two
   implementations that agree, they are one implementation.

   The rule for everything below: JavaScript may listen for events, set
   attributes, and FORMAT a number Rust already computed. If a line of it does
   arithmetic on a protocol quantity, that is a bug.

   THE ONE DECLARED EXCEPTION is `S.amm`, the toy counterparty that stands in
   for a swap venue so that the fee reaching the garden has a plausible source.
   It is labelled as such everywhere it surfaces, and nothing the GARDEN does is
   computed from it: the fee it produces enters the protocol only by being handed
   to `R.dripSplit` / `R.loyaltySplit`, which are Rust.

/* ═══════════════════════════════════════════════════════════════════════════
   ACTIONS — each one is a call into Rust plus bookkeeping of balances.

   LANGUAGE LAW, from the owner's own correction:
     · You do not SELL $FLWRS and you never "cash out". You BURN $FLWRS and the
       vault releases settled stables. garden_state_v3.clsp:382 is `s_out -=
       units` — a burn — and :383-386 bind it to a real melt from MELT_PH, so
       the ledger debit and the custody outflow are the same event in-puzzle.
       There is no sale, no counterparty, no order book, no exit fee, no queue.
     · You do not DEPOSIT in the sense of saving. You USE THE SUITE and are
       CREDITED for the contribution as it converts through the economic supply
       chain into the vault.
   ═══════════════════════════════════════════════════════════════════════════ */
const A={
  /* op1 — the PLAIN path. Still not "add money": it is value entering the
     vault, and what comes back is a claim on the vault, not a balance. */
  contribute(x){ if(x<=0n||x>S.cash) return;
    const r=R.navMint(x,S.supply,Number(S.vault)); if(!r) return;
    S.cash-=x; S.vault+=x; S.supply+=r.mint; S.flwrs+=r.mint; S.paidIn+=x;
    log(`Contributed ${money(x)} &middot; credited ${tok(r.mint)} $FLWRS`); snap(); },

  /* op3 EXIT — a BURN. `s_out -= units` (garden_state_v3.clsp:382), with the
     melt asserted from MELT_PH for exactly -units (:386). The stables come OUT
     OF THE VAULT; nobody buys the $FLWRS, because there is nothing to buy —
     the units cease to exist. */
  burnForStables(x){ if(x<=0n||x>S.flwrs||!S.supply) return;
    const out=R.navRedeem(x,Number(S.vault),S.supply); if(out===null) return;
    S.flwrs-=x; S.supply-=x; S.vault-=out; S.cash+=out;
    S.paidIn = S.paidIn>out? S.paidIn-out : 0n;
    log(`Burned ${tok(x)} $FLWRS &middot; vault released ${money(out)} in stables`); snap(); },

  /* op2 DRIP — THE WATERFALL, and the provenance of 81%.
     garden_loyalty_drip_fund_v3.clsp:28-31 draws the two hops:
        fee --> 90% --> GARDEN_FUND_PH --(op2)--> vault 90% / incident 10%
            \-- 10% --> RESERVE_VAULT_PH (loyalty)
     so the vault receives 0.90 x 0.90 = 81% of the RAW fee. Both hops are
     computed by Rust (loyalty_split then drip_split); the page never multiplies
     the two, and never prints the product as a bare constant.
     A FEE NEVER MINTS: s_out is untouched here (garden_state_v3.clsp do_drip). */
  drip(raw){ if(raw<=0n) return null;
    const {loyalty:toLoyalty, rest:toFund} = R.loyaltySplit(raw);   // hop 1, off the RAW fee
    const [toVault, toIncident] = R.dripSplit(toFund);    // hop 2, on the remainder
    S.vault+=toVault; S.inc+=toIncident; S.pool+=toLoyalty;
    S.feeRaw+=raw; S.feeToVault+=toVault; S.feeToIncident+=toIncident; S.feeToLoyalty+=toLoyalty;
    /* The deferred fold: a forfeit is never distributable in the unit that
       created it. Pending C folds into the index only on the NEXT drip. */
    if(S.pend>0n && S.w>0n){
      const d=R.loyaltyIndexDelta(S.pend,S.w);
      if(d!==null){ S.idx+=d; S.pend=0n; }
    }
    if(S.w>0n){ const d=R.loyaltyIndexDelta(toLoyalty,S.w); if(d!==null) S.idx+=d; }
    return {raw, toFund, toLoyalty, toVault, toIncident}; },

  /* op4 ATTRIB — plants FOUR ROWS AT ZERO MATURITY. It does NOT pay anybody.
     garden_state_v3.clsp:458 is `s_out += minted` — the same mint site as op1 —
     and the legs are PLANTED (:106-116 in the row layer), so a referrer receives
     a POSITION at zero maturity, never a payout. */
  attribute(x){ if(x<=0n||x>S.cash) return;
    const r=R.navMint(x,S.supply,Number(S.vault)); if(!r) return;
    const sh=R.attribShares(r.mint,false,false); if(!sh) return;
    S.cash-=x; S.vault+=x; S.supply+=r.mint; S.paidIn+=x;
    S.payerCred+=sh.payer; S.creatorCred+=sh.creator;
    S.referrerCred+=sh.referrer; S.treasuryCred+=sh.treasury;
    plantRow(sh.payer,'payer'); plantRow(sh.creator,'creator');
    plantRow(sh.referrer,'referrer'); plantRow(sh.treasury,'treasury');
    log(`Attribution on ${money(x)} &middot; planted 4 rows at zero maturity (${tok(r.mint)} $FLWRS)`);
    snap(); },

  /* A row is the unit of claim. MIN_ROW_UNITS dust REVERTS — it is never
     rounded away, because rounding a claim away is how a claim disappears. */
  plant(x){ if(x<=0n||x>S.flwrs) return;
    if(x < C.MIN_ROW_UNITS){ log(`Refused: ${tok(x)} is below MIN_ROW_UNITS (${tok(C.MIN_ROW_UNITS)}) — dust reverts, it is never rounded away`); return; }
    S.flwrs-=x; S.w+=x; plantRow(x,'you');
    log(`Planted a row of ${tok(x)} $FLWRS &middot; maturity starts at zero`); snap(); },

  /* Unstaking NEVER burns. `returned == unstake_units` is asserted in Rust
     (garden.rs:351). Principal always comes back; only ACCRUED yield can be
     forfeited, and the forfeit is DEFERRED into pending C. */
  unstake(rowId, oilBps){
    const row=S.rows.find(r=>r.id===rowId); if(!row) return;
    const r=R.rowSettle(row.units,row.units,S.idx,row.snap,S.w,row.plantH,S.h,C.K,oilBps||0);
    if(!r) return;
    S.w-=row.units; S.flwrs+=r.returned; S.rows=S.rows.filter(z=>z.id!==rowId);
    if(r.forfeit>0n) S.pend+=r.forfeit;      // DEFERRED — folds on the next drip
    if(r.oil>0n) S.oil+=r.oil;
    log(`Unstaked row #${rowId} &middot; principal ${tok(r.returned)} returned in full`
      + (r.forfeit>0n? ` &middot; ${tok(r.forfeit)} accrued forfeited to stayers (deferred)`:'')
      + (r.oil>0n? ` &middot; minted ${tok(r.oil)} $OIL`:''));
    snap(); },

  /* $OIL's only sink: burn it to ADVANCE a row's clock. phi-capped by Rust. */
  advance(rowId, burn){
    const row=S.rows.find(r=>r.id===rowId); if(!row||burn<=0n||burn>S.oil) return;
    const st=R.rowSettle(row.units,0n,S.idx,row.snap,S.w,row.plantH,S.h,C.K,0);
    if(!st) return;
    const dh = S.h - row.plantH;
    const r=R.oilAdvance(st.acc,dh,C.K,burn,C.OIL_PHI_MAX_BPS);
    if(!r) return;
    const spent = burn - r.unspent;
    S.oil-=spent; S.oilBurned+=spent;
    row.plantH = row.plantH > r.dh ? row.plantH - r.dh : 0n;   // the clock moved
    log(`Burned ${tok(spent)} $OIL &middot; advanced row #${rowId} by ${blocksToWords(r.dh)}`
      + (r.full?' &middot; row is now fully matured':''));
    snap(); },
};
function plantRow(units,who){
  S.rows.push({id:S.nextRow++, units, snap:S.idx, plantH:S.h, who});
}

   THE WATERFALL — objection #3. The 81% is REAL, and its provenance is drawn,
   never asserted. Both hops come from Rust:
      hop 1  loyalty_split(raw)   -> [toFund, toLoyalty]   (carve off the RAW fee)

   shows the two hops and lets the number follow from them. A number without
   its derivation reads as invented.
   ═══════════════════════════════════════════════════════════════════════════ */
function waterfallSvg(raw){
  const {loyalty:toLoyalty, rest:toFund} = R.loyaltySplit(raw);
  const [toVault, toIncident] = R.dripSplit(toFund);
  const f = v => money(v);
  return `<svg class="flow" viewBox="0 0 640 250" role="img"

/* ═══════════════════════════════════════════════════════════════════════════
   THE MATURITY CURVE. The control IS the curve — a ring "would be malpractice"
   (docs/DESIGN-frontend-mapping-2026-09-15.md:270-272). Position marker, a
   half-maturity crosshair at dh=K, and a dashed fully-matured asymptote.
   Colour law: GREY the future, never redden it (:295).
   Every plotted y is m_apply() from Rust. The x axis is a screen coordinate.
   ═══════════════════════════════════════════════════════════════════════════ */
function curveSvg(units, dh, k){
  const W=520,H=190,PAD=34, span=Number(k)*4;
  const pts=[];
  for(let i=0;i<=60;i++){
    const x=span*i/60;
    const m=R.mApply(units,BigInt(Math.round(x)),k);
    pts.push([PAD+(W-PAD-14)*(x/span), H-26-(H-52)*(Number(m)/Number(units))]);
  }
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const cx=PAD+(W-PAD-14)*Math.min(1,Number(dh)/span);
  const mNow=R.mApply(units,dh,k);
  const cy=H-26-(H-52)*(Number(mNow)/Number(units));
  const hx=PAD+(W-PAD-14)*(Number(k)/span);
  const hm=R.mApply(units,k,k);
  const hy=H-26-(H-52)*(Number(hm)/Number(units));
  return `<svg viewBox="0 0 ${W} ${H}" class="flow" role="img"
      aria-label="Maturity curve. The row is at ${pct(Number(mNow)/Number(units),1)} of its units.">
    <line x1="${PAD}" y1="${H-26}" x2="${W-14}" y2="${H-26}" stroke="var(--line2)"/>
    <line x1="${PAD}" y1="26" x2="${W-14}" y2="26" stroke="var(--ink3)" stroke-dasharray="4 4" opacity=".6"/>
    <text x="${W-14}" y="20" text-anchor="end" class="lbl">FULLY MATURED &mdash; APPROACHED, NEVER REACHED</text>
    <line x1="${hx}" y1="26" x2="${hx}" y2="${H-26}" stroke="var(--ink3)" stroke-dasharray="3 3" opacity=".55"/>
    <text x="${hx+5}" y="${H-10}" class="lbl">dh = K &middot; HALF</text>
    <path d="${d}" fill="none" stroke="var(--grow)" stroke-width="2"/>
    <path d="${d}" fill="none" stroke="var(--ink3)" stroke-width="2" opacity=".35"
      stroke-dasharray="1000" stroke-dashoffset="${-1000+1000*Math.min(1,Number(dh)/span)}"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--grow)"/>
    <line x1="${hx-4}" y1="${hy}" x2="${hx+4}" y2="${hy}" stroke="var(--ink2)"/>
    <text x="${PAD}" y="${H-10}" class="lbl">PLANTED</text>
  </svg>`;
}
/* The slope, annotated IN WORDS (docs/DESIGN-frontend-mapping-2026-09-15.md:273-284).
   The two maturity values are Rust's; this only chooses which sentence to show. */
function slopeWords(units,dh,k){
  const now=R.mApply(units,dh,k);
  const week=R.mApply(units,dh+BigInt(Math.round(7*86400/BLOCK_SEC)),k);
  const gain=week-now;
  if(gain<=0n) return 'This row is so far along the curve that another week adds nothing you can see.';
  return `Another week here matures a further ${tok(gain)} $FLWRS. The curve is concave: this is the fastest it will ever be again.`;
}

}

      <div class="hs ${d>=0?'up':'dn'}">${d>=0?'+':'&minus;'}$${Math.abs(d).toFixed(6)} today</div>
      <div class="foot">Always exactly the vault divided by the supply. There is no smoothing and no

    <div>
      <div class="holdrow" style="margin:0;padding:0;border:0">

/* ── Previews. Each reads an input and asks Rust; none computes. ─────────── */
const val = id => { const el=document.getElementById(id); if(!el) return 0n;
  const n=parseFloat(el.value.replace(/[^0-9.]/g,'')); return isFinite(n)&&n>0? BigInt(Math.round(n*1e6)) : 0n; };
function refreshPreviews(){
  const dp=document.getElementById('depprev');
  if(dp){ const x=val('dep'); const r=x>0n? R.navMint(x,S.supply,Number(S.vault)):null;
    dp.innerHTML = r? `<div class="prev">
      <div class="pl"><span>Value entering the vault</span><b>${money(x)}</b></div>
      <div class="pl"><span>Float to incumbents</span><b>${tok(r.cut)} $FLWRS</b></div>
      <div class="pl tot"><span>Credited to you</span><b>${tok(r.mint)} $FLWRS</b></div></div>`
      : (x>0n? '<div class="prev"><div class="pl"><span>Refused</span><b>the contract would revert</b></div></div>':''); }

  const rp=document.getElementById('redprev');
  if(rp){ const x=val('red'); const out=x>0n&&S.supply? R.navRedeem(x,Number(S.vault),S.supply):null;
    rp.innerHTML = out!==null&&x>0n? `<div class="prev">
      <div class="pl"><span>$FLWRS burned &mdash; destroyed, not sold</span><b>${tok(x)}</b></div>
      <div class="pl tot"><span>Stables released by the vault</span><b>${money(out)}</b></div></div>` : ''; }

  const ap=document.getElementById('attrprev');
  if(ap){ const x=val('attr'); const r=x>0n? R.navMint(x,S.supply,Number(S.vault)):null;
    const sh=r? R.attribShares(r.mint,false,false):null;
    ap.innerHTML = sh? `<div class="prev">
      <div class="pl"><span>Payer &mdash; planted as a row</span><b>${tok(sh.payer)}</b></div>
      <div class="pl"><span>Creator &mdash; planted as a row</span><b>${tok(sh.creator)}</b></div>
      <div class="pl"><span>Referrer &mdash; planted as a row</span><b>${tok(sh.referrer)}</b></div>
      <div class="pl"><span>Treasury &mdash; planted as a row</span><b>${tok(sh.treasury)}</b></div>
      <div class="pl tot"><span>All four at zero maturity</span><b>${tok(r.mint)} $FLWRS</b></div></div>`:''; }

  const op=document.getElementById('oilprev');
  if(op){ const el=document.getElementById('oilbps'); const bps=el?Number(el.value):1650;
    const sp=document.getElementById('oilbpsv'); if(sp) sp.textContent=bps;
    const forf=1000n*U; const m=R.oilMint(forf,bps);
    op.innerHTML=`<div class="prev">
      <div class="pl"><span>Forfeiture</span><b>${tok(forf)} $FLWRS</b></div>
      <div class="pl tot"><span>$OIL minted</span><b>${m===null?'refused':tok(m)}</b></div></div>`; }

  const sp2=document.getElementById('swapprev');
  if(sp2){ const x=val('swapin');
    if(x>0n){ const feeRaw = x*S.amm.feeBps/10000n;   // TOY COUNTERPARTY — declared exception
      const {loyalty:toLoy,rest:toFund}=R.loyaltySplit(feeRaw); const [toV,toI]=R.dripSplit(toFund);
      sp2.innerHTML=`<div class="prev">
        <div class="pl"><span>Swap size</span><b>${money(x)}</b></div>
        <div class="pl"><span>Fee charged <i>(toy venue)</i></span><b>${money(feeRaw)}</b></div>
        <div class="pl"><span>&rarr; loyalty carve (hop 1)</span><b>${money(toLoy)}</b></div>
        <div class="pl"><span>&rarr; incident (hop 2)</span><b>${money(toI)}</b></div>
        <div class="pl tot"><span>&rarr; the vault</span><b>${money(toV)}</b></div></div>`; } }

  const lp=document.getElementById('lpprev');
  if(lp){ const x=val('lp'); const p=POOLS[0];
    const e=R.postDepositEdge(p.sig,p.fee,PROV.OnChain,0,p.tvl,Number(x)/1e6,false);
    lp.innerHTML=`<div class="prev">
      <div class="pl"><span>Pool</span><b>${p.n}</b></div>
      <div class="pl"><span>LVR</span><b>${(e.lvr*100).toFixed(2)}%</b></div>
      <div class="pl tot"><span>Net edge after your size</span><b class="${e.net>=0?'up':'dn'}">${(e.net*100).toFixed(2)}%</b></div></div>`; }

  const cp=document.getElementById('commitprev');
  if(cp){ const x=val('commit'); const c=x>0n? R.batchClaim(Number(x)/1e6,50000,250000):null;
    cp.innerHTML = c===null? '' : `<div class="prev">
      <div class="pl"><span>Your commitment</span><b>${money(x)}</b></div>
      <div class="pl tot"><span>Tokens at the clearing price</span><b>${Number(c).toLocaleString()}</b></div></div>`; }

  const advp=document.getElementById('advprev');
  if(advp && S.rows.length){ const row=S.rows[0]; const burn=val('burn');
    const st=R.rowSettle(row.units,0n,S.idx,row.snap,S.w,row.plantH,S.h,C.K,0);
    const r=st&&burn>0n? R.oilAdvance(st.acc,S.h-row.plantH,C.K,burn,C.OIL_PHI_MAX_BPS):null;
    advp.innerHTML = r? `<div class="prev">
      <div class="pl"><span>Row</span><b>#${row.id}</b></div>
      <div class="pl"><span>Matured before</span><b>${tok(r.before)}</b></div>
      <div class="pl"><span>Clock advanced by</span><b>${blocksToWords(r.dh)}</b></div>
      <div class="pl tot gain"><span>Matured after</span><b>${tok(r.after)}</b></div>
      ${r.unspent>0n?`<div class="pl"><span>$OIL returned unspent (&phi; cap)</span><b>${tok(r.unspent)}</b></div>`:''}</div>`
      : '<div class="prev"><div class="pl"><span>Enter an amount</span><b>&mdash;</b></div></div>'; }

  const lsv=document.getElementById('levsizev'); if(lsv) lsv.textContent=usd0(S.lev.size);
  const lbv=document.getElementById('levbudv'); if(lbv) lbv.textContent=usd0(S.lev.budget);
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE GRADUATED CONSENT LADDER — calibrated to the LOSS, not to the action.
   docs/DESIGN-frontend-mapping-2026-09-15.md:183-189:
     0%   -> no gate at all
     <5%  -> inline
     >=5% -> a modal whose primary line is the ABSOLUTE forfeited amount
     >=25%-> one checkbox with the live number interpolated into its label
   "Type-to-confirm is overkill." The RATIO that selects the rung is computed
   from two Rust-returned quantities; the page only chooses which rung to show.
   ═══════════════════════════════════════════════════════════════════════════ */
function gateUnstake(rowId, onOk){
  const row=S.rows.find(r=>r.id===rowId); if(!row) return;
  const st=R.rowSettle(row.units,row.units,S.idx,row.snap,S.w,row.plantH,S.h,C.K,0);
  if(!st){ onOk(); return; }
  if(st.forfeit===0n){ onOk(); return; }                       // rung 0
  /* NOT protocol arithmetic. Both operands are quantities Rust already decided
     (st.forfeit and st.acc come straight out of row_settle), and the ratio is
     never displayed and never signed — it only SELECTS WHICH RUNG OF THE
     CONSENT LADDER TO SHOW. The amounts the user actually reads are the Rust
     values printed verbatim below. Were this ratio wrong, the user would see a
     lighter or heavier gate, never a wrong number. */
  const total = st.acc>0n? st.acc : 1n;
  const bp = Number(st.forfeit*10000n/total);                  // basis points of accrued lost
  if(bp < 500){ onOk(); return; }                              // rung 1: inline, no modal
  const heavy = bp >= 2500;                                    // rung 3 adds the checkbox
  const g=document.getElementById('gate');
  document.getElementById('gatebody').innerHTML=`
    <h2>You would forfeit earned yield</h2>
    <div class="hs">Your principal is not at risk &mdash; it is always returned in full.</div>
    <div class="dlgbig">${tok(st.forfeit)} $FLWRS</div>
    <div class="hs">of ${tok(st.acc)} earned, forfeited to the stakers who remain.</div>
    <div class="prev">
      <div class="pl prin"><span>Principal returned</span><b>${tok(st.returned)} $FLWRS (100%)</b></div>
      <div class="pl forf"><span>Earned yield forfeited</span><b>${tok(st.forfeit)} $FLWRS</b></div>
    </div>
    ${heavy? `<label class="ack"><input type="checkbox" id="ackbox">
      <span>I understand I am giving up <b>${tok(st.forfeit)} $FLWRS</b> of earned yield by unstaking now.</span></label>`:''}
    <div class="trio">
      <button class="go sec" id="gcancel">Keep the row</button>
      <button class="go" id="gok" ${heavy?'disabled':''}>Unstake anyway</button>
    </div>`;
  g.showModal();
  const ok=document.getElementById('gok');
  const box=document.getElementById('ackbox');
  if(box) box.onchange=()=>{ ok.disabled=!box.checked; };
  document.getElementById('gcancel').onclick=()=>g.close();
  ok.onclick=()=>{ g.close(); onOk(); };
}

/* ═══════════════════════════════════════════════════════════════════════════
   EVENT WIRING. Listening, reading inputs, calling an action, re-rendering.
   No protocol arithmetic lives below this line.
   ═══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', ev => {
  const chainBtn=ev.target.closest('#chainbtn');
  const chainOpt=ev.target.closest('[data-chain]');
  const pop=document.getElementById('chainpop');
  if(chainBtn){
    if(pop) pop.hidden=!pop.hidden;
    renderChain();
    return;
  }
  if(chainOpt){
    S.chain=chainOpt.dataset.chain;
    try{ localStorage.setItem('garden-host-chain', S.chain); }catch(_){}
    if(pop) pop.hidden=true;
    render();
    return;
  }
  if(pop && !pop.hidden && !ev.target.closest('.chain')) pop.hidden=true;
  const t=ev.target.closest('[data-tab],[data-a],[data-set],[data-unstake],[data-advance]');
  if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  if(t.dataset.set){
    const el=document.getElementById(t.dataset.set); if(!el) return;
    const v=t.dataset.v;
    if(v==='max') el.value=N(S.cash).toFixed(2);
    /* NOT protocol arithmetic: this fills a TEXT INPUT with a percentage of a
       balance the user already holds. It is the same act as the user typing the
       number themselves, and whatever lands in the box is then priced by Rust
       before anything happens to it. */
    else if(v[0]==='p'){ const p=BigInt(v.slice(1)); el.value=N(S.flwrs*p/100n).toFixed(6); }
    else el.value=v;
    refreshPreviews(); return;
  }
  if(t.dataset.unstake){ gateUnstake(Number(t.dataset.unstake), ()=>{ A.unstake(Number(t.dataset.unstake),0); render(); }); return; }
  if(t.dataset.advance){ S.tab='oil'; render(); return; }
  const a=t.dataset.a; if(!a) return;
  if(verdict(a).grade!=='executable') return;      // disabled controls never sign
  switch(a){
    case 'contribute': A.contribute(val('dep')); break;
    case 'exit':       A.burnForStables(val('red')); break;
    case 'plant':      A.plant(val('plant')); break;
    case 'claim_attr': A.attribute(val('attr')); break;
    case 'drip': {
      const r=A.drip(val('fee'));
      if(r) log(`Fee ${money(r.raw)} routed &middot; ${money(r.toVault)} reached the vault after two hops`);
      break; }
    case 'swap.dir0': {
      const x=val('swapin'); if(x<=0n||x>S.cash) break;
      const feeRaw=x*S.amm.feeBps/10000n;          // TOY COUNTERPARTY — declared exception
      const r=A.drip(feeRaw);
      if(r) log(`Swapped ${money(x)} &middot; fee ${money(feeRaw)} &middot; ${money(r.toVault)} to the vault`);
      break; }
    case 'add_lp': log('Liquidity added &middot; the position now earns the swap fee'); break;
    case 'remove_lp': log('Liquidity removed'); break;
    case 'perps.open': log('Position opened &middot; RUNWAY is the number that ends it'); break;
    case 'perps.close': log('Position closed'); break;
  }
  render();
});
document.addEventListener('input', ev => {
  const id=ev.target.id;
  if(id==='levsize'){ S.lev.size=Number(ev.target.value); render(); return; }
  if(id==='levbud'){ S.lev.budget=Number(ev.target.value); render(); return; }
  refreshPreviews();
});

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT — instantiate the wasm, load the constants, seed a little history so
   the curve and the hero have something honest to draw.
   ═══════════════════════════════════════════════════════════════════════════ */
function bytes(b64){ const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }

(async function boot(){
  try { const c=localStorage.getItem('garden-host-chain'); if(c&&CHAINS[c]) S.chain=c; } catch(_){}
  const mod = await WebAssembly.instantiate(bytes(WASM_B64), {});
  X = mod.instance.exports;
  MEM = new DataView(X.memory.buffer);
  OUT = X.out_ptr();
  C = R.consts();

  /* Genesis, then a plausible run of activity — every number produced by Rust. */
  S.h = C.K/2n;
  A.contribute(10000n*U);
  for(let i=0;i<6;i++) A.drip(2500n*U);
  A.plant(1200n*U);
  S.h += C.K/4n;
  for(let i=0;i<4;i++) A.drip(1800n*U);
  snap();
  render();

  /* The clock advances so the maturity curve and the ticking values move. */
  setInterval(()=>{ S.h += 40n; S.t += 750n;
    if(document.getElementById('view')) render(); }, 5000);
})().catch(e => {
  document.getElementById('view').innerHTML =
    `<div class="card"><h2>The engine did not start</h2><div class="cap">${esc(e&&e.message||e)}</div>
     <div class="stamp">This page refuses to render protocol numbers without the wasm that computes
     them. There is no JavaScript fallback, because a fallback would be a second implementation and
     the whole claim of this page is that there is only one.</div></div>`;
});
</script>
