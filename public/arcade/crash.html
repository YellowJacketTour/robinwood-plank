<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PlankCrash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root {
    --bg-0: #05070c;
    --bg-1: #0a0e18;
    --bg-2: #121729;
    --line: #1e2740;
    --ink: #eef1fb;
    --ink-dim: #7c85a3;
    --accent: #ff5a3c;
    --accent-glow: #ff8a5c;
    --win: #3ee08c;
    --win-glow: #7bffc0;
    --lose: #ff4d6a;
    --gold: #ffc857;
    --font-display: "Rockwell", "Cambria", Georgia, serif;
    --font-body: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg-0); color: var(--ink);
    font-family: var(--font-body);
  }
  #app {
    position: relative; height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
  }

  /* ── top bar ─────────────────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; z-index: 20; position: relative;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand .mark {
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--accent-glow), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .round { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
  .stats { display: flex; gap: 18px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); }
  .stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .gear {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(255,255,255,0.03); color: var(--ink-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .gear:hover { color: var(--ink); border-color: var(--accent); }

  /* ── stage (canvas) ──────────────────────────────────────────────── */
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas#fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .center-readout {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none; text-align: center;
  }
  .mult {
    font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: clamp(48px, 12vw, 108px); line-height: 1;
    color: var(--ink); text-shadow: 0 0 40px rgba(255,90,60,0.25);
    transition: color .12s, transform .08s;
  }
  .mult.live { color: var(--win); text-shadow: 0 0 46px rgba(62,224,140,0.45); }
  .mult.crashed { color: var(--lose); text-shadow: 0 0 46px rgba(255,77,106,0.5); }
  .mult .x { font-size: 0.42em; opacity: 0.7; margin-left: 2px; }
  .substatus {
    margin-top: 10px; font-family: var(--font-mono); font-size: 12.5px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim);
  }
  .outcome-banner {
    margin-top: 16px; padding: 8px 20px; border-radius: 999px; font-weight: 700;
    font-size: 14px; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s;
  }
  .outcome-banner.show { opacity: 1; transform: translateY(0); }
  .outcome-banner.win { background: rgba(62,224,140,0.12); color: var(--win); border: 1px solid rgba(62,224,140,0.3); }
  .outcome-banner.lose { background: rgba(255,77,106,0.1); color: var(--lose); border: 1px solid rgba(255,77,106,0.28); }

  /* ── bottom control deck ─────────────────────────────────────────── */
  .deck {
    position: relative; z-index: 20; padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--bg-0) 35%);
  }
  .stake-row {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;
  }
  .chip {
    font-family: var(--font-mono); font-size: 13px; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--ink-dim); cursor: pointer;
  }
  .chip.active { border-color: var(--accent); color: var(--ink); background: rgba(255,90,60,0.1); }
  .chip:disabled { opacity: 0.35; cursor: default; }

  .primary-btn {
    width: 100%; max-width: 520px; margin: 0 auto; display: block;
    padding: 20px; border-radius: 18px; border: none; cursor: pointer;
    font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.3px;
    color: #10131c; background: linear-gradient(135deg, var(--accent-glow), var(--accent));
    box-shadow: 0 8px 30px rgba(255,90,60,0.28);
    transition: transform .08s, box-shadow .2s, background .2s, color .2s;
  }
  .primary-btn:active { transform: scale(0.98); }
  .primary-btn:disabled {
    cursor: default; color: var(--ink-dim); background: var(--bg-2);
    box-shadow: none; border: 1px solid var(--line);
  }
  .primary-btn.cashout {
    background: linear-gradient(135deg, var(--win-glow), var(--win));
    box-shadow: 0 8px 34px rgba(62,224,140,0.35);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 34px rgba(62,224,140,0.35); }
    50% { box-shadow: 0 8px 46px rgba(62,224,140,0.6); }
  }
  .btn-sub { text-align: center; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }

  /* ── settings sheet ──────────────────────────────────────────────── */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.96);
    width: min(420px, 92vw); background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; z-index: 41; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .sheet.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .sheet h2 { margin: 0 0 4px; font-size: 15px; font-family: var(--font-display); }
  .sheet .hint { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 14px; }
  .sheet label { display: block; font-size: 11px; color: var(--ink-dim); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .sheet input {
    width: 100%; padding: 10px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg-1); color: var(--ink); font-family: var(--font-mono); font-size: 12.5px;
  }
  .sheet .row { display: flex; gap: 8px; margin-top: 14px; }
  .sheet button {
    flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px;
  }
  .sheet .connect { background: var(--accent); color: #10131c; }
  .sheet .close { background: var(--bg-1); color: var(--ink-dim); border: 1px solid var(--line); }
  .conn-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); margin-right: 6px; }
  .conn-dot.on { background: var(--win); box-shadow: 0 0 8px var(--win); }

  .toast-log {
    position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 15; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim);
    max-width: 44vw; opacity: 0.55; pointer-events: none; line-height: 1.6;
  }
</style>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

const { ethers } = window;
const $ = (id) => document.getElementById(id);

// ── THREE.JS scene: launch pad → atmosphere → deep space ────────────────
// Real WebGL pipeline: PBR materials, a two-color gradient sky dome (vertex
// shader), UnrealBloomPass post-processing, GPU point-sprite starfield and
// thruster/crash particle systems, and the real, verified Chalkstronaut art
// (public/arcade/art/Chalkstronaut1.png -- RobinWood collection token
// #1174, IPFS CID bafybeiadhdudbdylicfqq7pdfw5qzdrggqu4bzaxbel5mulhsia6ax4zdy,
// chroma-keyed onto a CanvasTexture at load time) billboarded into 3D space
// via THREE.Sprite, so it always faces camera and lights/glows correctly
// with the scene around it. Four staged altitude bands, keyed to
// flightProgress (0..1):
//   pad        [0.00, 0.02)  static, on the slingshot
//   sky        [0.02, 0.35)  troposphere -- blue, clouds
//   stratos    [0.35, 0.65)  deep blue/violet, thinning air, first stars
//   space      [0.65, 1.00]  black, stars, satellites, an alien, a mystery
//                            plank artifact drifting past
const canvas = $("fx");
const clock = new THREE.Clock();

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
camera.position.set(0, 6, 26);
camera.lookAt(0, 8, 0);

// ── lighting: hemisphere (sky/ground) + a warm "sun" + a thruster point light
const hemi = new THREE.HemisphereLight(0x88a7ff, 0x2a1c10, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe6c2, 1.4);
// Positioned well off to the side and high, so its screen projection reads
// as a corner glint composed away from the astronaut, not a halo painted
// directly over their face -- a real bug the first placement had.
sun.position.set(34, 30, -14);
scene.add(sun);
const thrusterLight = new THREE.PointLight(0xffb37a, 0, 18, 2);
scene.add(thrusterLight);

// ── gradient sky dome -- real vertex-interpolated shader, not a flat color
const skyUniforms = {
  topColor: { value: new THREE.Color(0x0c1836) },
  bottomColor: { value: new THREE.Color(0x2e4a78) },
};
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(180, 32, 20),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    side: THREE.BackSide,
    depthWrite: false,
    vertexShader: `
      varying float vHeight;
      void main() {
        vHeight = normalize(position).y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      varying float vHeight;
      void main() {
        float f = smoothstep(-0.15, 0.85, vHeight);
        gl_FragColor = vec4(mix(bottomColor, topColor, f), 1.0);
      }
    `,
  })
);
scene.add(skyDome);
scene.fog = new THREE.FogExp2(0x1e2c4a, 0.012);

// ── starfield: a real GPU point-sprite field, additive-blended so bloom
// picks it up naturally once we're high enough for it to fade in.
const STAR_COUNT = 2200;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT * 3);
for (let i = 0; i < STAR_COUNT; i++) {
  const r = 60 + Math.random() * 110;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 1.6 - 0.8);
  starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi)) * 0.6 + 4;
  starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}
starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  color: 0xeef1fb, size: 0.55, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ── launch pad: pallet of planks + slingshot posts (PBR wood material)
const padGroup = new THREE.Group();
const plankMat = new THREE.MeshStandardMaterial({ color: 0x9c6a3e, roughness: 0.85, metalness: 0.02 });
for (let row = 0; row < 4; row++) {
  const plank = new THREE.Mesh(new THREE.BoxGeometry(9, 0.5, 2.2), plankMat);
  plank.position.set(0, row * 0.55, 0);
  padGroup.add(plank);
}
const postMat = new THREE.MeshStandardMaterial({ color: 0x4a3420, roughness: 0.9 });
for (const side of [-1, 1]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 3.4, 8), postMat);
  post.position.set(side * 1.5, 3.5, 0);
  post.rotation.z = side * 0.12;
  padGroup.add(post);
}
padGroup.position.set(0, -6, 0);
scene.add(padGroup);

// ── satellites: real geometry with metal/roughness PBR values so the sun
// light actually reads on them, not flat-shaded placeholders.
const satBodyMat = new THREE.MeshStandardMaterial({ color: 0xc7cede, roughness: 0.35, metalness: 0.7 });
const satPanelMat = new THREE.MeshStandardMaterial({ color: 0x2c3660, roughness: 0.25, metalness: 0.5, emissive: 0x0b1230, emissiveIntensity: 0.4 });
const satellites = [];
for (let i = 0; i < 3; i++) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.6), satBodyMat);
  g.add(body);
  for (const side of [-1, 1]) {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.7), satPanelMat);
    panel.position.set(side * 1.5, 0, 0);
    g.add(panel);
  }
  g.userData = { angle: Math.random() * Math.PI * 2, radius: 22 + i * 8, height: 8 + i * 5, speed: 0.04 + Math.random() * 0.03 };
  satellites.push(g);
  scene.add(g);
}

// ── alien: simple but real-lit low-poly figure with an emissive glow
const alienMat = new THREE.MeshStandardMaterial({ color: 0x7ee096, roughness: 0.4, metalness: 0.1, emissive: 0x1c4a2c, emissiveIntensity: 0.6 });
const alienGroup = new THREE.Group();
const alienHead = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), alienMat);
alienHead.scale.set(1, 1.3, 0.9);
alienGroup.add(alienHead);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0e1a12, roughness: 0.2 });
for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), eyeMat);
  eye.scale.set(1, 1.4, 0.6);
  eye.position.set(side * 0.22, 0.05, 0.45);
  eye.rotation.z = side * 0.3;
  alienGroup.add(eye);
}
alienGroup.position.set(14, 12, -18);
scene.add(alienGroup);

// ── mystery plank artifact: a rune-etched wooden monolith drifting in deep
// space -- a lore hook, not a real collected asset.
const artifactMat = new THREE.MeshStandardMaterial({ color: 0xb98553, roughness: 0.6, metalness: 0.1, emissive: 0x8a5a20, emissiveIntensity: 0.35 });
const artifactGroup = new THREE.Group();
const artifactBody = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.6, 0.5), artifactMat);
artifactGroup.add(artifactBody);
const runeMat = new THREE.MeshStandardMaterial({ color: 0xffc878, emissive: 0xffb050, emissiveIntensity: 1.4, roughness: 0.3 });
for (let i = 0; i < 3; i++) {
  const rune = new THREE.Mesh(new THREE.CircleGeometry(0.09, 12), runeMat);
  rune.position.set(0, -0.7 + i * 0.7, 0.26);
  artifactGroup.add(rune);
}
artifactGroup.position.set(-16, 10, -14);
scene.add(artifactGroup);

// ── Chalkstronaut: real RobinWood art (token #1334, "Chalkstronaut" trait,
// "Rare" background -- ungraded, so no rarity-sticker icons in the
// corners, AND a real *solid color* background (blue) rather than white.
// A white-background variant was tried first and was a real chroma-key
// bug: the suit's own near-white highlights fell inside the same key
// tolerance as the background, silently eating parts of the character.
// A flat, saturated color the character's own palette never touches keys
// cleanly. Verified on-chain via robinwoodTokenUri()/IPFS, chroma-keyed
// at load time and billboarded into 3D space as a THREE.Sprite so it
// always faces camera and reads
// correctly against the moving sky/lighting behind it.
const chalkstronautImg = new Image();
let chalkstronautSprite = null;
chalkstronautImg.crossOrigin = "anonymous";
chalkstronautImg.onload = () => {
  const off = document.createElement("canvas");
  off.width = chalkstronautImg.width;
  off.height = chalkstronautImg.height;
  const octx = off.getContext("2d");
  octx.drawImage(chalkstronautImg, 0, 0);
  const data = octx.getImageData(0, 0, off.width, off.height);
  const px = data.data;
  const keyR = px[0], keyG = px[1], keyB = px[2];
  const tolerance = 40;
  const w = off.width, h = off.height;
  const cornerClear = w * 0.19; // strips the four small trait-rarity icons printed in the corners of the real artwork -- not part of the character
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const dr = px[i] - keyR, dg = px[i + 1] - keyG, db = px[i + 2] - keyB;
      const isKeyColor = Math.sqrt(dr * dr + dg * dg + db * db) < tolerance;
      const inCorner = (x < cornerClear || x > w - cornerClear) && (y < cornerClear || y > h - cornerClear);
      if (isKeyColor || inCorner) px[i + 3] = 0;
    }
  }
  octx.putImageData(data, 0, 0);
  const tex = new THREE.CanvasTexture(off);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  chalkstronautSprite = new THREE.Sprite(mat);
  chalkstronautSprite.scale.set(5.4, 5.4, 1);
  scene.add(chalkstronautSprite);
};
chalkstronautImg.src = "art/Chalkstronaut4.png";

// ── particle systems: chalk-dust thruster + crash burst, real GPU points
function makeParticleSystem(maxCount, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(maxCount * 3);
  const alpha = new Float32Array(maxCount);
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size: 0.32, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  scene.add(points);
  return { points, geo, pos, alpha, vel: new Float32Array(maxCount * 3), life: new Float32Array(maxCount), cursor: 0, maxCount };
}
const thrusterParticles = makeParticleSystem(400, 0xe4e8f5);
const crashParticles = makeParticleSystem(500, 0xff8a6c);

function emitParticles(system, origin, n, spread, speed) {
  for (let k = 0; k < n; k++) {
    const i = system.cursor;
    system.pos[i * 3] = origin.x;
    system.pos[i * 3 + 1] = origin.y;
    system.pos[i * 3 + 2] = origin.z;
    const a = Math.random() * Math.PI * 2;
    const b = Math.random() * Math.PI - Math.PI / 2;
    const v = (Math.random() * spread + 0.4) * speed;
    system.vel[i * 3] = Math.cos(a) * Math.cos(b) * v;
    system.vel[i * 3 + 1] = Math.sin(b) * v - 0.6;
    system.vel[i * 3 + 2] = Math.sin(a) * Math.cos(b) * v;
    system.life[i] = 1;
    system.cursor = (system.cursor + 1) % system.maxCount;
  }
}
function updateParticles(system, dt) {
  for (let i = 0; i < system.maxCount; i++) {
    if (system.life[i] <= 0) continue;
    system.pos[i * 3] += system.vel[i * 3] * dt;
    system.pos[i * 3 + 1] += system.vel[i * 3 + 1] * dt;
    system.pos[i * 3 + 2] += system.vel[i * 3 + 2] * dt;
    system.vel[i * 3 + 1] -= 0.4 * dt;
    system.life[i] -= dt * 0.7;
    if (system.life[i] <= 0) system.pos[i * 3 + 1] = -9999;
  }
  system.geo.attributes.position.needsUpdate = true;
}

// spawnParticles(color, n, spread) -- spawns at the astronaut's current
// world position. Signature kept intentionally simple: the chain-logic
// code below only ever wants "burst some particles where the player is
// right now," it doesn't track 3D coordinates itself.
function spawnParticles(color, n, spread) {
  const origin = chalkstronautSprite ? chalkstronautSprite.position : new THREE.Vector3(0, 0, 0);
  crashParticles.points.material.color.set(color);
  emitParticles(crashParticles, origin, n, spread, 3.2);
}

// ── post-processing ──────────────────────────────────────────────────
// The pass stack and every shader below is adapted directly from a sibling
// real-production Three.js space game (spacescanners/frontend/src/postfx.ts)
// -- not reinvented, not a generic bloom-only demo. Same techniques, same
// proven composer ordering (render -> bloom -> god rays -> OutputPass ->
// display-space grade -> lens flare, so the grade's vignette runs on the
// final sRGB image and the flare draws on top of it, not underneath).

// Cinematic grade: contrast + saturation lift, vignette, animated film
// grain, and a damage/impact chromatic-aberration channel-split -- reused
// here for the crash moment instead of a hull hit. Runs in display space
// (after OutputPass), which is what makes it read as a photographer's
// grade rather than a scene-space filter.
const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uVignette: { value: 0.32 },
    uGrain: { value: 0.045 },
    uContrast: { value: 1.06 },
    uSat: { value: 1.08 },
    uAberration: { value: 0.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uContrast, uSat, uAberration;
    varying vec2 vUv;
    void main(){
      vec3 c;
      if (uAberration > 0.001){
        vec2 dir = (vUv - 0.5);
        float ab = uAberration * 0.012 * (0.4 + length(dir));
        c.r = texture2D(tDiffuse, vUv + dir * ab).r;
        c.g = texture2D(tDiffuse, vUv).g;
        c.b = texture2D(tDiffuse, vUv - dir * ab).b;
      } else {
        c = texture2D(tDiffuse, vUv).rgb;
      }
      c = (c - 0.5) * uContrast + 0.5;
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      c = mix(vec3(l), c, uSat);
      float d = length(vUv - 0.5);
      float vig = smoothstep(0.85, 0.32, d);
      c *= mix(1.0, vig, uVignette);
      float g = fract(sin(dot(vUv * (1.0 + fract(uTime)), vec2(12.9898, 78.233))) * 43758.5453);
      c += (g - 0.5) * uGrain;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`,
};

// God rays: screen-space volumetric light shafts marching from each pixel
// toward the sun's projected screen position, accumulating only genuinely
// bright pixels so the scene doesn't smear into haze.
const GodRaysShader = {
  uniforms: {
    tDiffuse: { value: null },
    uLight: { value: new THREE.Vector2(0.5, 0.5) },
    uColor: { value: new THREE.Color(0xffe6c2) },
    uStrength: { value: 0.0 },
    uDecay: { value: 0.94 },
    uTime: { value: 0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uLight; uniform vec3 uColor;
    uniform float uStrength, uDecay, uTime;
    varying vec2 vUv;
    const int SAMPLES = 32;
    float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
    void main(){
      vec3 base = texture2D(tDiffuse, vUv).rgb;
      if (uStrength <= 0.0){ gl_FragColor = vec4(base, 1.0); return; }
      vec2 dir = (uLight - vUv) / float(SAMPLES);
      vec2 uv = vUv;
      float decay = 1.0;
      float shaft = 0.0;
      float j = fract(sin(dot(vUv, vec2(12.9898, 78.233)) + uTime) * 43758.5453);
      uv += dir * j;
      for (int i = 0; i < SAMPLES; i++){
        uv += dir;
        float s = max(0.0, lum(texture2D(tDiffuse, uv).rgb) - 0.62) * 1.5;
        shaft += s * decay;
        decay *= uDecay;
      }
      shaft /= float(SAMPLES);
      gl_FragColor = vec4(base + uColor * shaft * uStrength, 1.0);
    }`,
};

// Lens flare: procedural ghosts + halo marching from the sun's screen
// position through screen-centre. No textures -- soft discs in the shader.
// Drawn after the grade so the vignette doesn't eat it.
const LensFlareShader = {
  uniforms: {
    tDiffuse: { value: null },
    uLight: { value: new THREE.Vector2(0.5, 0.5) },
    uColor: { value: new THREE.Color(0xffe6c2) },
    uStrength: { value: 0.0 },
    uAspect: { value: 1.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uLight; uniform vec3 uColor;
    uniform float uStrength, uAspect;
    varying vec2 vUv;
    float disc(vec2 p, vec2 c, float r, float soft){
      float d = length((p - c) * vec2(uAspect, 1.0));
      return 1.0 - smoothstep(r * (1.0 - soft), r, d);
    }
    void main(){
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      if (uStrength > 0.0){
        vec2 toCenter = vec2(0.5) - uLight;
        float flare = 0.0;
        flare += disc(vUv, uLight, 0.13, 1.0) * 0.46;
        flare += disc(vUv, uLight, 0.038, 0.9) * 0.68;
        flare += disc(vUv, uLight + toCenter * 0.5,  0.05, 0.9) * 0.35;
        flare += disc(vUv, uLight + toCenter * 0.85, 0.085, 0.95) * 0.22;
        flare += disc(vUv, uLight + toCenter * 1.25, 0.06, 0.9) * 0.28;
        flare += disc(vUv, uLight + toCenter * 1.6,  0.12, 0.97) * 0.16;
        flare += disc(vUv, uLight + toCenter * 2.0,  0.04, 0.85) * 0.3;
        col += uColor * flare * uStrength;
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.22, 0.25, 0.995);
composer.addPass(bloomPass);
const godRaysPass = new ShaderPass(GodRaysShader);
composer.addPass(godRaysPass);
composer.addPass(new OutputPass());
const gradePass = new ShaderPass(GradeShader);
composer.addPass(gradePass);
const lensFlarePass = new ShaderPass(LensFlareShader);
composer.addPass(lensFlarePass);

// Project the sun's direction to screen UV each frame and feed god rays +
// lens flare -- same technique as the reference: a world point far along
// the light's direction, projected through the camera, with an off-screen/
// behind-camera guard so the effects fade out cleanly instead of glitching.
const _lightWorld = new THREE.Vector3();
function lightScreenUV(worldPos) {
  _lightWorld.copy(worldPos).project(camera);
  if (_lightWorld.z > 1) return null;
  const x = _lightWorld.x * 0.5 + 0.5, y = _lightWorld.y * 0.5 + 0.5;
  if (x < -0.35 || x > 1.35 || y < -0.35 || y > 1.35) return null;
  return { x, y };
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  lensFlarePass.uniforms.uAspect.value = w / h;
}
window.addEventListener("resize", resize);

let phaseState = "idle"; // idle | betting | live | crashed
let flightProgress = 0; // 0..1, drives ascent height
let crashedAt = null;
let launchAt = null; // performance.now() at moment LIVE begins -- slingshot snap
let shakeAmount = 0;

function skyColorAt(progress) {
  const bands = [
    { p: 0.00, top: [12, 24, 46], bottom: [46, 74, 120] },
    { p: 0.22, top: [30, 96, 176], bottom: [120, 176, 224] },
    { p: 0.45, top: [18, 30, 92], bottom: [64, 60, 150] },
    { p: 0.68, top: [6, 8, 22], bottom: [22, 18, 48] },
    { p: 1.00, top: [2, 3, 8], bottom: [4, 5, 14] },
  ];
  let a = bands[0], b = bands[bands.length - 1];
  for (let i = 0; i < bands.length - 1; i++) {
    if (progress >= bands[i].p && progress <= bands[i + 1].p) { a = bands[i]; b = bands[i + 1]; break; }
  }
  const span = Math.max(b.p - a.p, 0.0001);
  const f = Math.min(Math.max((progress - a.p) / span, 0), 1);
  const lerp = (c1, c2) => c1.map((v, i) => Math.round(v + (c2[i] - v) * f));
  return { top: lerp(a.top, b.top), bottom: lerp(a.bottom, b.bottom) };
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  const progress = phaseState === "crashed" ? Math.min(flightProgress, 1) : flightProgress;
  const groundY = -1.5, topY = 30;
  const launchElapsed = launchAt ? performance.now() - launchAt : 0;
  const snap = phaseState === "live" && launchElapsed < 260
    ? Math.sin((launchElapsed / 260) * Math.PI) * 1.6 * (1 - launchElapsed / 260)
    : 0;
  const astronautY = (phaseState === "crashed" ? groundY + (topY - groundY) * Math.min(flightProgress, 1) : groundY + (topY - groundY) * flightProgress) - snap;

  // sky + fog track altitude
  const sky = skyColorAt(progress);
  skyUniforms.topColor.value.setRGB(sky.top[0] / 255, sky.top[1] / 255, sky.top[2] / 255);
  skyUniforms.bottomColor.value.setRGB(sky.bottom[0] / 255, sky.bottom[1] / 255, sky.bottom[2] / 255);
  scene.fog.color.setRGB(sky.bottom[0] / 255, sky.bottom[1] / 255, sky.bottom[2] / 255);
  scene.fog.density = 0.02 - progress * 0.018;

  // stars fade in once above the troposphere; hemisphere light dims as we
  // leave atmosphere (no more scattered daylight to bounce off objects)
  starMat.opacity = Math.max(0, (progress - 0.3) / 0.4) * 0.9;
  hemi.intensity = 1.1 - progress * 0.7;
  sun.intensity = 1.4 - progress * 0.3;

  // launch pad fades out (moves below the horizon) once the climb begins
  padGroup.visible = progress < 0.1;
  padGroup.position.y = -6 - Math.max(0, progress - 0.02) * 40;

  // satellites drift once above the stratosphere
  const satAlpha = Math.max(0, Math.min(1, (progress - 0.45) / 0.2));
  for (const s of satellites) {
    s.visible = satAlpha > 0.01;
    s.userData.angle += s.userData.speed * dt;
    s.position.set(
      Math.cos(s.userData.angle) * s.userData.radius,
      s.userData.height + Math.sin(t * 0.3 + s.userData.angle) * 1.2,
      Math.sin(s.userData.angle) * s.userData.radius - 20
    );
    s.rotation.y = -s.userData.angle;
  }

  // alien + mystery artifact appear deep in space
  alienGroup.visible = progress > 0.78;
  alienGroup.position.y = 12 + Math.sin(t * 0.4) * 0.6;
  artifactGroup.visible = progress > 0.85;
  artifactGroup.rotation.y = t * 0.15;
  artifactGroup.position.y = 10 + Math.sin(t * 0.25 + 1) * 1;

  // Chalkstronaut position + tilt
  if (chalkstronautSprite) {
    chalkstronautSprite.position.set(Math.sin(t * 0.4) * (phaseState === "live" ? 0.4 : 0), astronautY, 0);
    chalkstronautSprite.material.rotation = phaseState === "crashed"
      ? -Math.min((performance.now() - (crashedAt || performance.now())) / 260, 1) * 1.1
      : Math.sin(t * 1.1) * 0.06;
    thrusterLight.position.copy(chalkstronautSprite.position).y -= 1;
    thrusterLight.intensity = phaseState === "live" ? 2.2 + Math.sin(t * 20) * 0.4 : 0;
    if (phaseState === "live" && Math.random() < 0.6) {
      const origin = chalkstronautSprite.position.clone();
      origin.y -= 1.6;
      emitParticles(thrusterParticles, origin, 2, 0.6, 1.6);
    }
  }

  updateParticles(thrusterParticles, dt);
  updateParticles(crashParticles, dt);

  // camera: slow cinematic dolly that follows the astronaut's altitude,
  // plus a shake impulse on crash
  const camShakeX = shakeAmount > 0.01 ? (Math.random() - 0.5) * shakeAmount : 0;
  const camShakeY = shakeAmount > 0.01 ? (Math.random() - 0.5) * shakeAmount : 0;
  shakeAmount *= 0.9;
  const targetCamY = 6 + astronautY * 0.55;
  camera.position.set(Math.sin(t * 0.06) * 3 + camShakeX, targetCamY + camShakeY, 24 - progress * 6);
  camera.lookAt(0, astronautY * 0.6 + 6, 0);

  // god rays + lens flare track the sun; fade smoothly as the scene leaves
  // atmosphere (the sun reads less as "the light source" once starlight
  // and satellites take over the composition in deep space)
  const sunUV = lightScreenUV(sun.position);
  const sourceStrength = Math.max(0, 1 - progress * 0.6);
  godRaysPass.uniforms.uLight.value.set(sunUV ? sunUV.x : 0.5, sunUV ? sunUV.y : 0.5);
  godRaysPass.uniforms.uStrength.value = sunUV ? 0.22 * sourceStrength : 0;
  godRaysPass.uniforms.uTime.value = t;
  lensFlarePass.uniforms.uLight.value.set(sunUV ? sunUV.x : 0.5, sunUV ? sunUV.y : 0.5);
  lensFlarePass.uniforms.uStrength.value = sunUV ? 0.12 * sourceStrength : 0;

  // cinematic grade: crash impact reads as a lens-stress chromatic-
  // aberration crunch that decays over ~0.6s, same technique as a hull hit
  const crashElapsed = crashedAt ? (performance.now() - crashedAt) / 600 : 1;
  gradePass.uniforms.uAberration.value = Math.max(0, 1 - crashElapsed);
  gradePass.uniforms.uTime.value = t;

  composer.render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// ── keeper: auto lock / auto reveal / auto register / auto claim ────────
async function keeperTick(round, roundId, blockNum, chainNow) {
  try {
    // Gate on the CHAIN's own clock (the contract's real check), not the
    // browser's Date.now() -- on a locally time-warped dev node those two
    // clocks can drift arbitrarily far apart, and trusting the client's
    // clock would make the keeper wait forever even though lockRound()
    // would already succeed on-chain.
    if (Number(round.phase) === 0 && Number(round.bettingEndsAt) <= chainNow && !attemptedLockThisRound) {
      attemptedLockThisRound = true;
      await (await crash.lockRound()).wait().catch(() => {});
    }
    if (Number(round.phase) === 1 && blockNum > Number(round.targetBlock) && !attemptedRevealThisRound) {
      attemptedRevealThisRound = true;
      await (await crash.revealCrash(roundId)).wait().catch(() => {});
    }
    if (Number(round.phase) === 2 && signer) {
      const stake = await crash.stakeOf(roundId, signer.address);
      if (stake > 0n) {
        const isRegistered = await crash.registered(roundId, signer.address);
        if (!isRegistered && !attemptedRegisterThisRound && blockNum <= Number(round.registrationDeadlineBlock)) {
          attemptedRegisterThisRound = true;
          await (await crash.registerResult(roundId)).wait().catch(() => {});
        }
        const isClaimed = await crash.claimed(roundId, signer.address);
        if (!isClaimed && !attemptedClaimThisRound && blockNum > Number(round.registrationDeadlineBlock)) {
          attemptedClaimThisRound = true;
          try {
            await (await crash.claim(roundId)).wait();
            await (await crash.withdrawPayments(signer.address)).wait();
          } catch {
            /* not a winner -- expected outcome, not an error */
          }
        }
      }
    }
  } catch {
    /* keeper races with other tabs/players -- silent by design */
  }
}

async function refresh() {
  if (!crash) return;
  try {
    const roundId = await crash.currentRoundId();
    const round = await crash.currentRound();
    const blockNum = await provider.getBlockNumber();
    const chainNow = (await provider.getBlock(blockNum)).timestamp;

    if (currentRoundIdCache !== roundId.toString()) {
      currentRoundIdCache = roundId.toString();
      attemptedLockThisRound = false;
      attemptedRevealThisRound = false;
      attemptedRegisterThisRound = false;
      attemptedClaimThisRound = false;
      hideOutcome();
    }

    $("roundLabel").textContent = "ROUND " + roundId.toString();
    $("poolStat").textContent = Number(ethers.formatEther(round.pool)).toFixed(3) + " ETH";
    $("playersStat").textContent = (await crash.participantCount(roundId)).toString();

    const phase = Number(round.phase);
    const prevPhaseState = phaseState;
    phaseState = phase === 0 ? "betting" : phase === 1 ? "live" : "crashed";
    if (phaseState === "live" && prevPhaseState !== "live") launchAt = performance.now();

    const stake = signer ? await crash.stakeOf(roundId, signer.address) : 0n;
    const hasStake = stake > 0n;
    const cashOutBlock = signer ? await crash.cashOutBlockOf(roundId, signer.address) : 0n;
    const hasCashedOut = cashOutBlock > 0n;

    if (phase === 0) {
      flightProgress = 0; crashedAt = null;
      setMultReadout("1.00", "idle");
      const secsLeft = Math.max(0, Number(round.bettingEndsAt) - chainNow);
      $("substatus").textContent = secsLeft > 0 ? `LAUNCHING IN ${secsLeft}s` : "LOCKING…";
      updatePrimaryButton(hasStake ? "waiting" : "betting-open");
    } else if (phase === 1) {
      const liveBps = await crash.liveMultiplierBps(roundId);
      const xStr = bpsToXStr(liveBps);
      lastMult = Number(xStr);
      setMultReadout(xStr, "live");
      flightProgress = Math.min(1, Math.log(Number(xStr)) / Math.log(12));
      $("substatus").textContent = "IN FLIGHT";
      if (!hasStake) updatePrimaryButton("watching");
      else if (hasCashedOut) updatePrimaryButton("cashed", { sub: "Cashed out — waiting for the crash to see the final multiplier" });
      else updatePrimaryButton("live-hold", { sub: `Staked ${ethers.formatEther(stake)} ETH` });
    } else {
      if (crashedAt === null) { crashedAt = performance.now(); shakeAmount = 1.4; spawnParticles(0xff4d6a, 60, 3.5); }
      const xStr = bpsToXStr(round.crashMultiplierBps);
      setMultReadout(round.crashMultiplierBps > 0n ? xStr : "0.00", "crashed");
      $("substatus").textContent = round.crashMultiplierBps > 0n ? "CRASHED" : "VOIDED";

      if (!hasStake) {
        updatePrimaryButton("watching", { sub: "Next round starts automatically" });
      } else if (!hasCashedOut) {
        if (outcomeShownForRound !== currentRoundIdCache) {
          outcomeShownForRound = currentRoundIdCache;
          showOutcome("lose", "ROUND LOST — didn't cash out in time");
        }
        updatePrimaryButton("settling", { sub: "Next round starts automatically" });
      } else {
        const isClaimed = await crash.claimed(roundId, signer.address);
        if (isClaimed && outcomeShownForRound !== currentRoundIdCache) {
          outcomeShownForRound = currentRoundIdCache;
          showOutcome("win", `WON at ${bpsToXStr((await crash.cashOutBlockOf(roundId, signer.address)) > 0n ? round.crashMultiplierBps : 0n)}x`);
        }
        updatePrimaryButton("settling", { sub: isClaimed ? "Payout claimed — next round starts automatically" : "Settling your payout automatically…" });
      }
    }

    await keeperTick(round, roundId, blockNum, chainNow);
  } catch (err) {
    /* transient during round transitions */
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  refresh();
  pollTimer = setInterval(refresh, 1200);
}
</script>
</body>
