<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges"><title>Burning Heart — a little love, kept alight</title><desc>Original Charmville heart and flame. A gentle one-pixel rise and warm light; reduced-motion settings show the still heart.</desc><style>.heart{animation:float 3.2s steps(1,end) infinite}.flame-light,.heart-light{animation:warmth 3.2s ease-in-out infinite}.flame-light{animation-delay:-1.6s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}@keyframes warmth{0%,100%{opacity:1}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.heart,.flame-light,.heart-light{animation:none!important;transform:none!important;opacity:1!important}}</style><g class="heart"><path fill="#1B120A" d="M16 2h2v4h2v4h2v2h4v2h2v2h2v7h-2v3h-4v2h-5v2h-6v-2H8v-2H4v-3H2v-7h2v-2h2v-2h6v-2h2V6h2z"/>
<path fill="#AF761D" d="M16 6h2v4h2v4h2v4H10v-4h4v-4h2z"/>
<path class="flame-light" fill="#E9B43F" d="M16 10h2v4h2v4h-8v-3h4z"/>
<path fill="#FFF2CF" d="M16 14h2v4h-3v-2h1z"/>
<path fill="#BE123C" d="M6 14h6v3h2v2h4v-2h2v-3h6v2h2v6h-2v3h-4v2h-5v1h-2v-1h-5v-2H6v-3H4v-6h2z"/>
<path class="heart-light" fill="#F43F5E" d="M7 15h4v3h2v3h6v-3h2v-3h4v2h1v4h-3v3h-4v2h-4v-2h-4v-3H6v-4h1z"/>
<path fill="#FFF2CF" d="M7 16h4v2H7z"/></g></svg>
